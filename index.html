<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>문장수집가 2nd — 서재와 문장, 그리고 고요한 독서</title>
  <meta name="description" content="책 속의 빛나는 문장을 수집하고, 독서 진행률 관리, 필사 타자 연습, 감성 카드 제작까지 통합 제공하는 진중한 독서 플랫폼">

  <!-- Fonts & Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;700;900&family=Nanum+Myeongjo:wght@400;700&family=Maru+Buri:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: '#F5F4F0',
            'paper-dark': '#121110',
            accent: '#1C1917',
            'accent-hover': '#000000',
            warmBg: '#EFECE6',
            stone: {
              50: '#fafaf9',
              100: '#f5f5f4',
              200: '#e7e5e4',
              700: '#44403c',
              800: '#292524',
              900: '#1c1917',
              950: '#0c0a09',
              DEFAULT: '#292524'
            },
            cardBg: '#FFFFFF',
            paperBorder: '#E2DFD8'
          },
          borderRadius: {
            'none': '0',
            'sm': '5px',
            'DEFAULT': '5px',
            'md': '5px',
            'lg': '5px',
            'xl': '5px',
            '2xl': '5px',
            '3xl': '5px',
            'full': '9999px'
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            serif: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
            batang: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Modular CSS -->
  <link rel="stylesheet" href="./src/css/variables.css">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="stylesheet" href="./src/css/typing.css">
  <link rel="stylesheet" href="./src/css/studio.css">
</head>
<body class="bg-[#F5F4F0] text-stone-900 antialiased min-h-screen flex flex-col selection:bg-stone-300 selection:text-stone-950 transition-colors duration-300">
  
  <!-- App Main Container (Full Viewport Edge-to-Edge Desktop App) -->
  <div id="app" class="w-full max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-2xl relative overflow-x-hidden md:max-w-none md:my-0 md:rounded-none md:border-none md:shadow-none md:flex-row">
    
    <!-- Desktop Left Navigation Sidebar (Hidden on Mobile, Layer z-20 above backdrop) -->
    <aside id="desktop-sidebar" class="hidden md:flex w-64 lg:w-72 flex-shrink-0 bg-white dark:bg-stone-900 text-stone-900 dark:text-stone-100 border-r border-stone-200/80 dark:border-stone-800 p-6 flex-col justify-between select-none transition-colors relative z-20">
      <!-- Injected by Nav Component -->
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col min-w-0 bg-[#F5F4F0]/60 relative">
      
      <!-- Top Header Bar (Hidden) -->
      <header id="top-header" class="hidden">
        <!-- Hidden as requested -->
      </header>

      <!-- Main View Container -->
      <main id="main-view" class="flex-1 pb-20 md:pb-8 overflow-y-auto px-3.5 sm:px-5 md:px-8 lg:px-12 py-4 sm:py-6 space-y-4 max-w-7xl mx-auto w-full">
        <!-- Injected by Active Tab/Component -->
      </main>

      <!-- Bottom Navigation (Mobile Only) -->
      <nav id="bottom-nav" class="md:hidden fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 bg-white/95 backdrop-blur-md border-t border-stone-200 px-2 py-2 flex items-center justify-around">
        <!-- Injected by Nav Component -->
      </nav>

    </div>

    <!-- Fullscreen / Centered Overlay Container -->
    <div id="overlay-container" class="fixed inset-0 z-50 pointer-events-none transition-all duration-300">
      <!-- Injected dynamically -->
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden transition-all duration-300">
      <!-- Injected dynamically -->
    </div>

  </div>

  <!-- Entry Script (ES Modules) -->
  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
