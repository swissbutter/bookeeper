<style>
  :root {
    --paper-bg: #FAF8F5;
    --paper-app: #FFFFFF;
    --card-bg: #FFFFFF;
    --card-bg-elevated: #F7F4EF;
    
    --ink-main: #2B2623;
    --ink-sub: #6E6660;
    --ink-muted: #A39A92;
    --line-subtle: #F2EDE6;
    --line-strong: #E5DDD2;
    
    --accent: #D97A43;        /* Soft warm milk tea / gentle cinnamon */
    --accent-dark: #C26532;   /* Soft warm terra cotta */
    --accent-light: rgba(217, 122, 67, 0.10);
    --accent-gradient: linear-gradient(135deg, #E08752 0%, #C86C38 100%);
    
    --book: #D97A43;
    --book-bg: #F9EFE6;
    --book-border: #F3DEC9;
    
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-full: 9999px;
    
    --shadow-sm: 0 2px 8px rgba(43, 38, 35, 0.04);
    --shadow-md: 0 8px 24px -4px rgba(43, 38, 35, 0.06), 0 2px 6px -1px rgba(43, 38, 35, 0.04);
    --shadow-lg: 0 16px 36px -6px rgba(43, 38, 35, 0.10);
    --shadow-sheet: 0 -10px 38px rgba(0, 0, 0, 0.14);
    
    --nav-bg: rgba(250, 248, 245, 0.90);
    --btn-selected-bg: #D97A43;
    --btn-selected-text: #FFFFFF;
    --btn-selected-border: #D97A43;

    font-size: 16px;
  }

  /* Sleek Premium Dark Theme Override */
  body.dark-theme {
    --paper-bg: #141416;
    --paper-app: #0D0D0F;
    --card-bg: #1B1B1E;
    --card-bg-elevated: #242428;
    --ink-main: #F3F1ED;
    --ink-sub: #CEC8C0;
    --ink-muted: #9C958C;
    --line-subtle: #28282D;
    --line-strong: #3F3F46;
    --accent: #E59866;       /* Soft gentle pastel peach/cinnamon */
    --accent-light: rgba(229, 152, 102, 0.18);

    --nav-bg: rgba(20, 20, 22, 0.92);
    /* Dark Mode Selected Button: Soft Warm Pastel Cinnamon Amber with Black Text */
    --btn-selected-bg: #E59866;
    --btn-selected-text: #0D0D0F;
    --btn-selected-border: #E59866;

    background-color: #0D0D0F;
    color: #F3F1ED;
  }

  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  html, body {
    margin: 0; padding: 0;
    background-color: var(--paper-bg);
    min-height: 100vh;
    width: 100%;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    color: var(--ink-main);
    overflow-x: hidden;
  }

  /* App Shell Container - Fluid 100% Responsive Viewport */
  #app-wrapper {
    width: 100%;
    max-width: 100%;
    min-height: 100vh;
    margin: 0;
    background-color: var(--paper-app);
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: none;
    border: none;
  }
  @media (min-width: 768px) {
    body {
      background-color: var(--paper-app) !important;
    }
    #app-wrapper {
      max-width: 750px;
      margin: 0 auto;
    }
  }

  /* Sticky Top Navigation Bar */
  header.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: var(--nav-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--line-subtle);
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  header.top-bar .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header.top-bar .brand-icon {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: var(--accent-gradient);
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    box-shadow: 0 3px 10px rgba(194, 94, 0, 0.28);
  }
  header.top-bar .brand-title h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--ink-main);
  }
  header.top-bar .brand-title h1 em {
    font-style: normal;
    color: var(--accent);
  }

  header.top-bar .back-btn {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-full);
    border: 1px solid var(--line-subtle);
    background: var(--card-bg);
    color: var(--ink-main);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  header.top-bar .back-btn:active {
    transform: scale(0.92);
  }

  header.top-bar .nav-title {
    font-size: 15.5px;
    font-weight: 700;
    flex: 1;
    text-align: left;
    margin-left: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  header.top-bar .add-book-btn {
    background: var(--ink-main);
    color: #FFF;
    border: none;
    border-radius: var(--radius-full);
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s, opacity 0.15s;
    margin-left: auto;
  }
  header.top-bar .add-book-btn:active { transform: scale(0.95); opacity: 0.9; }

  /* Main Content Viewport */
  main#main-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 90px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    animation: fadeIn 0.25s ease-out;
  }

  /* Custom Search Results Scrollbar (Far Right Edge) */
  #kakao-results::-webkit-scrollbar,
  #modal-kakao-results::-webkit-scrollbar {
    width: 6px;
  }
  #kakao-results::-webkit-scrollbar-track,
  #modal-kakao-results::-webkit-scrollbar-track {
    background: transparent;
  }
  #kakao-results::-webkit-scrollbar-thumb,
  #modal-kakao-results::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 3px;
  }
  #kakao-results::-webkit-scrollbar-thumb:hover,
  #modal-kakao-results::-webkit-scrollbar-thumb:hover {
    background: var(--accent);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Floating Fixed Bottom Navigation Bar */
  nav.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 100%;
    z-index: 50;
    background: var(--nav-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-top: 1px solid var(--line-subtle);
    display: flex;
    justify-content: space-around;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  }
  @media (min-width: 768px) {
    nav.bottom-nav {
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      max-width: 750px;
    }
  }

  nav.bottom-nav button {
    flex: 1;
    background: none;
    border: none;
    padding: 6px 0 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: var(--ink-muted);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.2s ease, transform 0.2s ease;
    border-radius: var(--radius-sm);
  }
  nav.bottom-nav button .nav-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 28px;
    border-radius: var(--radius-full);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  nav.bottom-nav button.active {
    color: var(--accent);
    font-weight: 700;
  }
  nav.bottom-nav button.active .nav-icon {
    background: var(--accent-light);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* Floating Action Button (FAB) for Writing New Record (White Theme, High-placed, Library-only) */
  .fab-write-btn {
    position: fixed;
    bottom: 96px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #FFFFFF;
    color: var(--accent, #D97A43);
    border: 2.5px solid #FFFFFF;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 28px rgba(43, 38, 35, 0.22), 0 4px 10px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    z-index: 990;
    opacity: 0.9;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, box-shadow 0.2s ease;
  }
  @media (min-width: 768px) {
    .fab-write-btn {
      right: calc(50% - 375px + 20px);
    }
  }
  .fab-write-btn:hover {
    opacity: 1;
    transform: scale(1.08) translateY(-2px);
    box-shadow: 0 14px 32px rgba(43, 38, 35, 0.32);
    color: var(--accent-dark, #C26532);
  }
  .fab-write-btn:active {
    transform: scale(0.92);
    opacity: 0.95;
  }

  /* Badges & Chips */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    color: var(--accent);
    background: var(--accent-light);
    border: 1px solid rgba(194, 94, 0, 0.15);
  }
  .badge.outline {
    background: var(--card-bg, #FFFFFF);
    border: 1px solid rgba(0, 0, 0, 0.08);
    color: var(--ink-sub, #6E6660);
    box-shadow: none;
  }

  .chip-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    scrollbar-width: none;
  }
  .chip-bar::-webkit-scrollbar { display: none; }
  .chip {
    border: 1px solid var(--line-subtle);
    background: var(--card-bg);
    border-radius: var(--radius-full);
    padding: 8px 16px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-sub);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-sm);
  }
  .chip:active {
    transform: scale(0.95);
  }
  .chip.selected {
    background: var(--btn-selected-bg);
    border-color: var(--btn-selected-border);
    color: var(--btn-selected-text);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
  }

  /* Modern Segmented Control Tab Switcher */
  .segmented-control {
    display: flex;
    background: var(--paper-bg);
    border-radius: var(--radius-full);
    padding: 3px;
    margin-bottom: 16px;
    border: 1px solid var(--line-subtle);
  }
  .segmented-control button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-sub);
    border-radius: var(--radius-full);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
  }
  .segmented-control button.selected,
  .segmented-control button.active {
    background: var(--card-bg-elevated, #FFF);
    color: var(--ink-main);
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
  }

  /* Card Component */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius-md);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--line-subtle);
    width: 100%;
    box-sizing: border-box;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 18px;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    font-family: inherit;
    outline: none;
  }
  .btn:active {
    transform: scale(0.96);
  }
  .btn-primary {
    background: var(--btn-selected-bg, var(--ink-main));
    color: var(--btn-selected-text, #FFF);
    border: 1px solid var(--btn-selected-border, var(--ink-main));
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  }
  .btn-ghost {
    background: var(--card-bg);
    border: 1px solid var(--line-subtle);
    color: var(--ink-main);
    box-shadow: var(--shadow-sm);
  }
  .btn-sm {
    padding: 6px 14px;
    font-size: 12px;
    border-radius: var(--radius-full);
  }
  .btn.full {
    width: 100%;
  }

  /* Inputs & Forms */
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink-main);
    background: var(--paper-bg);
    border: 1px solid var(--line-subtle);
    border-radius: var(--radius-sm);
    outline: none;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }
  input[type="text"]:focus, input[type="number"]:focus, textarea:focus {
    border-color: var(--accent);
    background: #FFF;
    box-shadow: 0 0 0 3px var(--accent-light);
  }

  /* Search Bar */
  .search-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--line-subtle);
    border-radius: var(--radius-full);
    padding: 8px 18px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
    transition: all 0.2s ease;
  }
  .search-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .search-bar input {
    border: none !important;
    background: transparent !important;
    padding: 4px 0 !important;
    box-shadow: none !important;
    font-size: 13.5px;
    outline: none;
    width: 100%;
  }

  /* Screen Header */
  .screen-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 4px 0;
  }
  .screen-header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.6px;
    color: var(--ink-main);
  }
  .screen-header .header-icons {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bell-btn {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--line-subtle);
    width: 38px;
    height: 38px;
    border-radius: 50% !important;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    color: var(--ink-main);
    transition: transform 0.15s ease;
  }
  .bell-btn:active { transform: scale(0.92); }
  .bell-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    background: #E11D48;
    color: #FFF;
    font-size: 10px;
    font-weight: 800;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #FFF;
  }

  /* Currently Reading Banner */
  .reading-banner {
    background: linear-gradient(135deg, #FEF9EE 0%, #FDE68A 100%);
    border: 1px solid #FCD34D;
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 6px 20px rgba(217, 119, 6, 0.08);
    width: 100%;
    box-sizing: border-box;
    transition: transform 0.2s ease;
  }
  .reading-banner:active { transform: scale(0.98); }
  .reading-banner .rb-cover {
    width: 42px;
    height: 56px;
    border-radius: var(--radius-xs);
    background: var(--accent-gradient);
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(180, 83, 9, 0.25), inset -2px 0 4px rgba(0,0,0,0.15);
  }
  .reading-banner .rb-info { flex: 1; min-width: 0; }
  .reading-banner .rb-title { font-size: 14px; font-weight: 800; color: var(--ink-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reading-banner .rb-meta { font-size: 12px; color: var(--ink-sub); margin-top: 3px; font-weight: 600; }

  /* Feed Posts & Quotes (Design 4커뮤니티.html Inspired Quote Card) */
  .quote-card {
    position: relative;
    background: var(--card-bg, #FBF9F6);
    border: 1px solid rgba(127, 117, 112, 0.14);
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 18px;
    box-shadow: 0px 4px 20px rgba(43, 38, 35, 0.05);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .quote-card.has-open-menu {
    z-index: 1000 !important;
  }
  .quote-card:hover {

const SUPABASE_URL = 'https://eypvienfpglkdhzxmtet.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_r77QHYdEBQ_G6g5m67EPaQ_RIeCFwxO';
let supabaseClient = null;

if (window.supabase && SUPABASE_URL.startsWith('https://')) {
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function syncToSupabase() {
  if (!supabaseClient || !db) return;
  try {
    if (db.contents && db.contents.length > 0) {
      const bookRows = db.contents.map(c => ({
        id: String(c.id),
        type: c.type || 'BOOK',
        title: c.title || '',
        creator: c.creator || c.authors || '',
        publisher: c.publisher || '',
        isbn: c.isbn || '',
        cover: c.cover || c.thumbnail || null,
        genre: c.genre || '소설',
        total_page: c.totalPoint || c.page_count || null,
        rating: c.rating || 0,
        source_provider: c.sourceProvider || c.source || 'KAKAO'
      }));
      await supabaseClient.from('books').upsert(bookRows, { onConflict: 'id' });
    }

    if (db.myContent && db.myContent.length > 0) {
      const myRows = db.myContent.map(m => ({
        book_id: String(m.contentId),
        status: m.status || 'WANT',
        current_point: m.currentPoint || 0,
        start_date: m.startDate || null,
        finish_date: m.finishDate || null
      }));
      await supabaseClient.from('my_contents').upsert(myRows, { onConflict: 'book_id' });
    }

    if (db.posts && db.posts.length > 0) {
      const postRows = db.posts.map(p => ({
        id: String(p.id),
        book_id: String(p.contentId),
        point: p.point || null,
        memo_type: p.memoType || 'QUOTE',
        text: p.text || '',
        review: p.review || '',
        rating: p.rating || 0,
        spoiler: !!p.spoiler,
        likes: p.likes || 0
      }));
      await supabaseClient.from('posts').upsert(postRows, { onConflict: 'id' });
    }

    if (db.comments && db.comments.length > 0) {
      const commentRows = db.comments.map(cm => ({
        id: String(cm.id),
        post_id: String(cm.postId),
        text: cm.text || '',
        nickname: cm.nickname || '익명'
      }));
      await supabaseClient.from('comments').upsert(commentRows, { onConflict: 'id' });
    }
  } catch (e) {
    console.warn('Supabase sync warning:', e);
  }
}

async function syncFromSupabase() {
  if (!supabaseClient || !db) return;
  try {
    const { data: booksData } = await supabaseClient.from('books').select('*');
    if (booksData && booksData.length > 0) {
      booksData.forEach(b => {
        if (!db.contents.some(c => String(c.id) === String(b.id))) {
          db.contents.push({
            id: b.id,
            type: b.type,
            title: b.title,
            creator: b.creator,
            publisher: b.publisher,
            isbn: b.isbn,
            cover: b.cover,
            genre: b.genre,
            totalPoint: b.total_page,
            rating: b.rating,
            sourceProvider: b.source_provider
          });
        }
      });
    }

    const { data: postsData } = await supabaseClient.from('posts').select('*');
    if (postsData && postsData.length > 0) {
      postsData.forEach(p => {
        if (!db.posts.some(existing => String(existing.id) === String(p.id))) {
          db.posts.push({
            id: p.id,
            contentId: p.book_id,
            point: p.point,
            memoType: p.memo_type,
            text: p.text,
            review: p.review,
            rating: p.rating,
            spoiler: p.spoiler,
            nickname: '익명 수집가',
            mine: false,
            likes: p.likes || 0,
            comments: 0,
            createdAt: new Date(p.created_at || Date.now()).getTime()
          });
        }
      });
    }

    const { data: commentsData } = await supabaseClient.from('comments').select('*');
    if (commentsData && commentsData.length > 0) {
      if (!db.comments) db.comments = [];
      commentsData.forEach(cm => {
        const idx = db.comments.findIndex(existing => String(existing.id) === String(cm.id));
        const item = {
          id: cm.id,
          postId: cm.post_id,
          text: cm.text,
          nickname: cm.nickname || '익명',
          createdAt: new Date(cm.created_at || Date.now()).getTime()
        };
        if (idx >= 0) db.comments[idx] = { ...db.comments[idx], ...item };
        else db.comments.push(item);
      });
    }
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    if (typeof render === 'function') render();
  } catch(e) {
    console.warn('Supabase fetch error:', e);
  }
}

    toast('Supabase 설정이 없어 데모 계정으로 자동 로그인합니다.');

    loginWithDemoUser(provider);
  }

async function logoutUser() {
  if (supabaseClient) {
    await supabaseClient.auth.signOut();
  }
  currentUser = null;
  localStorage.removeItem('jigeumini_auth_user');
  if (typeof render === 'function') render();
}

function initAuthObserver() {
  if (!supabaseClient) return;

  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session && session.user) {
      handleAuthUser(session.user);
    }
  });

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      handleAuthUser(session.user);
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      localStorage.removeItem('jigeumini_auth_user');
      if (typeof render === 'function') render();
    }
  });
}

const ADMIN_EMAILS = ['mutuldu@gmail.com', 'admin@sentencecollector.app', 'admin@bookmate.me'];

function handleAuthUser(user) {

  if (completedCount >= 500) {

    nextRequirement = `${300 - completedCount}권 더 완독 시 마스터`; progressPercent = Math.round(((completedCount - 200) / 100) * 100);
  } else if (completedCount >= 100) {
    name = '에메랄드'; badge = '❇️'; color = '#10B981'; bg = 'rgba(16, 185, 129, 0.12)';
    nextRequirement = `${200 - completedCount}권 더 완독 시 다이아몬드`; progressPercent = Math.round(((completedCount - 100) / 100) * 100);
  } else if (completedCount >= 50) {
    name = '플래티넘'; badge = '💎'; color = '#3B82F6'; bg = 'rgba(59, 130, 246, 0.12)';
    nextRequirement = `${100 - completedCount}권 더 완독 시 에메랄드`; progressPercent = Math.round(((completedCount - 50) / 50) * 100);
  } else if (completedCount >= 20) {
    name = '골드'; badge = '🥇'; color = '#F59E0B'; bg = 'rgba(245, 158, 11, 0.12)';
    nextRequirement = `${50 - completedCount}권 더 완독 시 플래티넘`; progressPercent = Math.round(((completedCount - 20) / 30) * 100);
  } else if (completedCount >= 10) {
    name = '실버'; badge = '🥈'; color = '#6B7280'; bg = 'rgba(107, 114, 128, 0.12)';
    nextRequirement = `${20 - completedCount}권 더 완독 시 골드`; progressPercent = Math.round(((completedCount - 10) / 10) * 100);
  } else if (completedCount >= 3) {
    name = '브론즈'; badge = '🥉'; color = '#B45309'; bg = 'rgba(180, 83, 9, 0.12)';
    nextRequirement = `${10 - completedCount}권 더 완독 시 실버`; progressPercent = Math.round(((completedCount - 3) / 7) * 100);

/* ---------- Utilities ---------- */
function getContent(id) { return db.contents.find(c => c.id === id); }
function getMy(id) { return db.myContent.find(m => m.contentId === id); }

function fmtTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(diff / 86400000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (h < 24) return h + '시간 전';
  return d + '일 전';
}

function toast(msg) {
  // All internal message popups disabled
  return;
}

function esc(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function isSpoilerFor(post) {
  const content = getContent(post.contentId);
  if (!content) return false;
  const my = getMy(content.id);
  const myPoint = my ? (my.currentPoint || 0) : 0;
  if (post.point != null && post.point > myPoint) return true;
  return !!post.spoiler;
}

  }
}

function render() {
  applyTheme();

  const nav = document.querySelector('nav.bottom-nav');
  if (!currentUser) {
    if (nav) nav.style.display = 'none';
    const main = document.getElementById('main-content');
    if (main) {
      main.style.padding = '0';
      main.innerHTML = renderLandingScreen();
      main.scrollTop = 0;
    }
    renderModal();
    return;
  }

  if (nav) nav.style.display = 'flex';
  document.querySelectorAll('nav.bottom-nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === state.tab && state.overlayStack.length === 0);
  });

  const ov = curOverlay();
  const currentOvType = (ov && typeof ov === 'object' && ov.type) ? ov.type : null;
  renderHeader(ov);

  const main = document.getElementById('main-content');
  if (main) {
    const isRegManual = currentOvType === 'register' && document.getElementById('reg-view-manual')?.style.display === 'block';
    if (currentOvType === 'editBook' || isRegManual) {
      main.style.padding = '0';
    } else {
      main.style.padding = '';
    }
  }
  if (currentOvType) {
    if (currentOvType === 'register') main.innerHTML = renderRegister();
    else if (currentOvType === 'detail') main.innerHTML = renderDetail(ov.contentId);
    else if (currentOvType === 'editBook') main.innerHTML = renderEditBook(ov.contentId);
    else if (currentOvType === 'stats') main.innerHTML = renderStats();
  } else {
    if (state.tab === 'feed') main.innerHTML = renderFeed();
    else if (state.tab === 'library') main.innerHTML = renderLibrary();
    else if (state.tab === 'community') main.innerHTML = renderCommunity();
    else if (state.tab === 'my') main.innerHTML = renderMyPage();
  }

  attachEvents(ov);
  main.scrollTop = 0;
  
  // 오직 개별 도서 상세 컨텐츠 화면(currentOvType === 'detail')에서만 해당 책의 독서 기록 작성 + 버튼 노출
  const fabBtn = document.getElementById('floatingWriteBtn');
  if (fabBtn) {
    const isBookDetailView = (currentOvType === 'detail' && ov && ov.contentId);
    fabBtn.style.display = isBookDetailView ? 'flex' : 'none';
    if (isBookDetailView) {
      fabBtn.dataset.contentId = ov.contentId;
    } else {
      delete fabBtn.dataset.contentId;
    }
  }

  renderModal();
}

function renderCollectionStackedCovers(col) {
  const colPosts = (col.postIds || []).map(id => (db.posts || []).find(p => p.id === id)).filter(Boolean);
  const colBooks = [];
  const seenBookIds = new Set();

  colPosts.forEach(p => {
    const c = getContent(p.contentId);
    if (c && !seenBookIds.has(c.id)) {
      seenBookIds.add(c.id);
      colBooks.push(c);
    }
  });

  if (colBooks.length === 0) {
    return `
      <div style="padding:14px 16px; text-align:center; background:var(--paper-bg); border-radius:10px; color:var(--ink-muted); font-size:12.5px; border:1px dashed var(--line-subtle); margin:10px 0 12px;">
        📖 수집된 문장이 아직 없습니다.
      </div>
    `;
  }

  const coversHtml = colBooks.slice(0, 8).map((b, idx) => {
    const offsetLeft = idx * 26;
    const rotateDeg = (idx % 3 === 0 ? -4 : (idx % 3 === 1 ? 3 : -2));
    return `
      <div class="stacked-cover-item" style="position:absolute; left:${offsetLeft}px; top:4px; z-index:${10 - idx}; transition:all 0.2s ease; cursor:pointer;" title="${esc(b.title)} (${esc(b.creator || '저자 미상')})">
        ${b.cover ? `
          <img src="${b.cover}" alt="${esc(b.title)}" style="width:54px; height:78px; object-fit:cover; border-radius:6px; box-shadow:-4px 5px 12px rgba(0,0,0,0.2); border:1.5px solid rgba(255,255,255,0.9); transform:rotate(${rotateDeg}deg); background:#FFF;">
        ` : `
          <div style="width:54px; height:78px; border-radius:6px; background:linear-gradient(135deg, var(--accent) 0%, #D97706 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#FFF; font-size:11px; font-weight:800; text-align:center; padding:5px; box-shadow:-4px 5px 12px rgba(0,0,0,0.2); border:1.5px solid rgba(255,255,255,0.9); transform:rotate(${rotateDeg}deg);">
            <span style="font-size:16px;">📖</span>
            <span style="font-size:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; margin-top:2px;">${esc(b.title)}</span>
          </div>
        `}
      </div>
    `;
  }).join('');

  const containerWidth = Math.max(130, Math.min(colBooks.length, 8) * 26 + 60);

  return `
    <div style="background:var(--paper-bg); border-radius:12px; padding:12px 14px; border:1px solid var(--line-subtle); margin:10px 0 12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div style="font-size:12px; font-weight:800; color:var(--ink-muted); display:flex; align-items:center; gap:5px;">
          <span>📚 수집 도서 ${colBooks.length}권</span>
        </div>
        <div style="font-size:11.5px; color:var(--accent); font-weight:700;">총 ${colPosts.length}개 문장</div>
      </div>

      <div style="position:relative; height:90px; width:100%; overflow-x:auto; overflow-y:hidden; padding-bottom:4px;">
        <div style="position:relative; height:84px; width:${containerWidth}px;">
          ${coversHtml}
        </div>
      </div>

      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line-subtle);">
        ${colBooks.map(b => `
          <span style="font-size:11px; font-weight:700; color:var(--ink-main); background:var(--card-bg); border:1px solid var(--line-subtle); padding:2.5px 8px; border-radius:12px; display:inline-flex; align-items:center; gap:4px; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            📖 ${esc(b.title)}
          </span>
        `).join('')}
      </div>
    </div>
  `;
}

function renderBookItem(c) {
  if (!c) return '';
  const coverBg = c.coverBg || 'var(--accent)';
  return `
    <div class="item" data-opencontent="${c.id}">
      <div class="book-cover grid" style="background: ${coverBg};">
        ${c.cover ? `<img src="${c.cover}" alt="${esc(c.title)} 표지">` : `<span>${esc(c.title)}</span>`}
      </div>
      <div class="b-title">${esc(c.title)}</div>
      <div class="b-author">${esc(c.creator || '')}</div>
    </div>
  `;
}

function renderAnnouncementBanner() {
  const activeAnnouncements = (db.announcements || []).filter(a => a.active !== false);
  if (activeAnnouncements.length === 0) return '';

  return `
    <div class="announcement-feed-banner" style="background:linear-gradient(135deg, #1E1B4B 0%, #312E81 100%); color:#FFFFFF; padding:14px 16px; border-radius:10px; margin-bottom:18px; box-shadow:0 4px 16px rgba(30, 27, 75, 0.25); border:1px solid rgba(255,255,255,0.12);">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
        <div style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800; background:rgba(255,255,255,0.18); padding:3px 10px; border-radius:12px;">
          <span>📢</span>
          <span>서비스 공지사항</span>

          <div style="font-size:14px; font-weight:800; color:#FFFFFF; margin-bottom:3px;">${esc(a.title)}</div>
          <div style="font-size:12.5px; opacity:0.9; line-height:1.5; color:#E0E7FF;">${esc(a.content)}</div>

      `).join('<div style="height:1px; background:rgba(255,255,255,0.15); margin:8px 0;"></div>')}

}

function renderFeed() {
  let posts = [...(db.posts || [])].sort((a, b) => b.createdAt - a.createdAt);
  const unreadCount = (db.notifications || []).filter(n => n.unread).length;

  const screenHeader = `
    <div class="screen-header">
      <h1>피드</h1>
      <div class="header-icons">
        <button class="bell-btn" id="feedBellBtn" aria-label="알림 ${unreadCount}개">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
          </svg>
          ${unreadCount > 0 ? `<span class="bell-badge">${unreadCount}</span>` : ''}
        </button>
      </div>
    </div>
  `;

  const listHtml = posts.map(p => renderPostCard(p)).join('');

  const annBannerHtml = renderAnnouncementBanner();
  const activeBannerHtml = renderActiveReadingBanner();

  if (posts.length === 0) {
    return renderAdminHeaderBar() + screenHeader + annBannerHtml + activeBannerHtml + `
      <div class="empty-state">
        <span class="icon">📖</span>
        오늘의 독서 감상이 없어요.<br>'✍️ 새 기록 쓰기' 버튼으로 첫 인상을 남겨보세요!
      </div>
    `;
  }

  return renderAdminHeaderBar() + screenHeader + annBannerHtml + activeBannerHtml + listHtml;
}

            </div>

/* ---------- Library Screen & Barcode Graphics ---------- */

function barcodeHtml(c, m, activeDetailTab = 'MY') {
  if (!c) return '';
  const total = c.totalPoint || 1;
  const cur = Math.min(m ? (m.currentPoint || 0) : 0, total);
  
  // 탭 구분에 따른 바코드 핀포인트 선 필터링 (내 기록: mine === true, 커뮤니티 기록: mine === false)
  const isMineTab = (activeDetailTab === 'MY');
  const marks = db.posts.filter(p => p.contentId === c.id && p.point != null && (isMineTab ? !!p.mine : !p.mine));
  
  // 왼쪽부터 페이지 순서대로 정렬하여 제일 왼쪽 첫 번째 태그는 무조건 상단(TOP) 배치
  marks.sort((a, b) => (a.point || 0) - (b.point || 0));

  const pct = Math.min(Math.round((cur / total) * 100), 100);

  const MARK_COLORS = ['#F59E0B', '#EF4444', '#10B981', '#6366F1', '#EC4899', '#8B5CF6', '#06B6D4', '#F97316'];

  const tickCount = 80;
  const ticksHtml = Array.from({ length: tickCount }).map((_, idx) => {
    const isRead = ((idx + 1) / tickCount) * 100 <= pct;
    return `<i class="${isRead ? 'read-tick' : 'unread-tick'}"></i>`;
  }).join('');

  return `
    <div class="barcode-wrap" id="detailBarcodeWrap" style="cursor: grab; user-select: none; touch-action: none; position: relative;">
      <div class="ticks">${ticksHtml}</div>
      ${marks.map((mk, i) => {
        const color = MARK_COLORS[i % MARK_COLORS.length];
        const posPct = Math.min(Math.max((mk.point / total) * 100, 2), 98);
        const isBottom = (i % 2 === 1); // 0번째(왼쪽 첫번째)는 무조건 상단(isBottom=false)
        return `
          <div class="post-mark" data-post-id="${mk.id}" data-post-point="${mk.point}" data-is-mine="${mk.mine ? '1' : '0'}" style="left:${posPct}%; background:${color}; box-shadow:0 0 3px ${color}; cursor:pointer;" title="${mk.point}p 문장 기록">
            <span class="post-mark-label ${isBottom ? 'is-bottom' : 'is-top'}" data-post-id="${mk.id}" data-post-point="${mk.point}" data-is-mine="${mk.mine ? '1' : '0'}" style="background:${color}; pointer-events:auto; cursor:pointer; ${isBottom ? 'bottom:3px; top:auto;' : 'top:3px; bottom:auto;'}">${mk.point}p</span>
          </div>
        `;
      }).join('')}
      <div class="cursor-line" style="left:${(cur / total * 100)}%;"></div>
    </div>
  `;
}


function renderLibrary() {
  const allMy = db.myContent.map(m => ({ m, c: getContent(m.contentId) })).filter(x => x.c);

  const wantCount = allMy.filter(x => x.m.status === 'WANT').length;
  const activeCount = allMy.filter(x => x.m.status === 'ACTIVE').length;
  const doneCount = allMy.filter(x => x.m.status === 'DONE').length;

  const activeTab = state.libFilter || 'ACTIVE';
  const query = (state.libQuery || '').trim().toLowerCase();

  let filtered = allMy.filter(x => (x.m.status || 'ACTIVE') === activeTab);
  if (query) {
    filtered = filtered.filter(x =>
      x.c.title.toLowerCase().includes(query) ||
      (x.c.creator && x.c.creator.toLowerCase().includes(query))
    );
  }

  const itemsHtml = filtered.length === 0 ? `
    <div class="empty-state" style="grid-column: 1 / -1; padding: 60px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; box-sizing: border-box;">

      <div style="font-size: 14px; font-weight: 700; color: var(--ink-muted); text-align: center;">
        ${query ? '검색 결과가 없습니다.' : '등록한 책이 없어요'}
      </div>
    </div>
  ` : filtered.map(({ c }) => renderBookItem(c)).join('');

  return `
    ${renderAdminHeaderBar()}
    <div style="width:100%; box-sizing:border-box;">
      <!-- Screen Header with Title & Action Button -->
      <div class="screen-header" style="width:100%; box-sizing:border-box;">
        <h1>내 서재</h1>
        <button class="btn btn-sm btn-primary" id="libAddBookBtn" style="background:var(--accent); color:#FFFFFF; border:none; padding:7px 16px; border-radius:20px; font-size:12.5px; font-weight:800; box-shadow:0 4px 14px rgba(180, 83, 9, 0.3); cursor:pointer; display:inline-flex; align-items:center; gap:4px; transition:transform 0.15s, box-shadow 0.15s;">＋ 책 추가</button>
      </div>

      <!-- Search Bar -->

        <span>🔍</span>
        <input type="text" id="libSearchInput" placeholder="책 제목, 저자 검색" value="${esc(state.libQuery || '')}" style="width:100%;">
      </div>

      <!-- 내 서재 상태 칩 필터 (status-chips 디자인 적용) -->
      <div class="status-chips" style="width:100%; box-sizing:border-box; margin-top:8px; margin-bottom:14px; display:flex; justify-content:center; align-items:center; gap:8px; text-align:center;">
        <button class="badge ${activeTab === 'WANT' ? 'selected' : 'is-outline'}" data-libfilter="WANT" style="flex:1; text-align:center; padding:8px 10px; font-size:12.5px; font-weight:700;">보관함 (${wantCount})</button>
        <button class="badge ${activeTab === 'ACTIVE' ? 'selected' : 'is-outline'}" data-libfilter="ACTIVE" style="flex:1; text-align:center; padding:8px 10px; font-size:12.5px; font-weight:700;">읽는 중 (${activeCount})</button>
        <button class="badge ${activeTab === 'DONE' ? 'selected' : 'is-outline'}" data-libfilter="DONE" style="flex:1; text-align:center; padding:8px 10px; font-size:12.5px; font-weight:700;">완독 (${doneCount})</button>

      </div>
    </div>
  `;

function renderDetail(contentId) {
  const c = getContent(contentId);
  if (!c) return `<div class="empty-state">책을 찾을 수 없습니다.</div>`;
  const m = getMy(contentId);
  const status = m ? (m.status || 'NONE') : 'NONE';
  const curPoint = m ? (m.currentPoint || 0) : 0;
  const startDate = m ? (m.startDate || '2026.06.14') : '2026.06.14';
  const finishDate = (m && m.finishDate) ? m.finishDate : (status === 'DONE' ? '2026.07.19' : '진행 중');
  const readerCount = c.readerCount || 13;
  const totalPoint = c.totalPoint || 1;
  const pct = Math.min(Math.round((curPoint / totalPoint) * 100), 100);

  const allBookPosts = db.posts.filter(p => p.contentId === contentId).sort((a, b) => b.createdAt - a.createdAt);
  let totalRating = 0, countRating = 0;
  allBookPosts.forEach(p => { if (p.rating) { totalRating += p.rating; countRating++; } });
  const avgRatingStr = countRating > 0 ? (totalRating / countRating).toFixed(1) : (c.rating ? c.rating.toFixed(1) : '4.0');
  const numericRating = parseFloat(avgRatingStr);
  const fullStars = Math.floor(numericRating);
  const starsHtml = [1, 2, 3, 4, 5].map(n => `<span class="star ${n <= fullStars ? '' : 'empty'}">★</span>`).join('');

  let readerMsg = '함께 읽고 있습니다';
  if (status === 'WANT') {
    readerMsg = '보관했습니다';
  } else if (status === 'DONE') {
    readerMsg = '완독했습니다';
  } else if (status === 'ACTIVE') {
    readerMsg = '함께 읽고 있습니다';
  }

  const coverBg = c.coverBg || 'rgb(74, 111, 165)';
  const ambientColor = coverBg.includes('rgb') ? coverBg.replace('rgb', 'rgba').replace(')', ', 0.15)') : coverBg;

  const activeDetailTab = state.detailTab || 'MY';

  const filterLabelMap = { ALL: '필터', QUOTE: '✍️ 문장', THOUGHT: '💭 내생각', QUESTION: '❓ 의문점', SUMMARY: '📋 요약', REVIEW: '⭐ 리뷰' };

  const sortType = state.myPostSort || 'LATEST';
  const typeFilter = state.myPostTypeFilter || 'ALL';

  const myPosts = db.posts.filter(p => p.contentId === contentId && p.mine);
  let filteredMyPosts = myPosts.filter(p => {
    if (typeFilter === 'ALL') return true;
    return (p.memoType || 'QUOTE') === typeFilter;
  });

  if (sortType === 'LATEST') {
    filteredMyPosts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  } else if (sortType === 'LIKES') {
    filteredMyPosts.sort((a, b) => (b.likes || 0) - (a.likes || 0));

  const isMyFiltered = typeFilter !== 'ALL';
  const currentMyFilterLabel = filterLabelMap[typeFilter] || '필터';

function extractPageCount(b) {
  if (!b) return null;
  if (b.page_count && !isNaN(b.page_count)) return parseInt(b.page_count, 10);
  if (b.page && !isNaN(b.page)) return parseInt(b.page, 10);
  if (b.item_page && !isNaN(b.item_page)) return parseInt(b.item_page, 10);
  if (b.total_page && !isNaN(b.total_page)) return parseInt(b.total_page, 10);

  const text = ((b.contents || '') + ' ' + (b.title || '')).replace(/,/g, '');
  const match = text.match(/(\d{2,4})\s*(쪽|페이지|p\b)/i);
  if (match && match[1]) {
    const num = parseInt(match[1], 10);
    if (num >= 20 && num <= 3000) return num;
  }
  return null;
}

function parseCategoryToStandard(raw) {
  if (!raw) return null;
  const str = String(raw).trim();
  if (!str) return null;

  if (str.includes('소설') || str.includes('Fiction') || str.includes('문학소설') || str.includes('웹소설')) return '소설';
  if (str.includes('시/') || str.includes('에세이') || str.includes('수필') || str.includes('Poetry') || str.includes('Essay')) return '시/에세이';
  if (str.includes('인문') || str.includes('Humanities')) return '인문학';
  if (str.includes('철학') || str.includes('사상') || str.includes('Philosophy')) return '철학/사상';
  if (str.includes('역사') || str.includes('세계사') || str.includes('한국사') || str.includes('History')) return '역사/세계사';
  if (str.includes('사회') || str.includes('정치') || str.includes('법률') || str.includes('행정') || str.includes('Social')) return '사회/정치/법';
  if (str.includes('경제') || str.includes('경영') || str.includes('재테크') || str.includes('주식') || str.includes('투자') || str.includes('Business') || str.includes('Economics')) return '경제/경영/재테크';
  if (str.includes('자기계발') || str.includes('자기관리') || str.includes('성공') || str.includes('Self-Help') || str.includes('처세')) return '자기계발';
  if (str.includes('자연') || str.includes('과학') || str.includes('공학') || str.includes('수학') || str.includes('물리') || str.includes('생물') || str.includes('Science')) return '자연/과학/공학';
  if (str.includes('컴퓨터') || str.includes('IT') || str.includes('프로그래밍') || str.includes('인공지능') || str.includes('AI') || str.includes('소프트웨어') || str.includes('Computer')) return 'IT/컴퓨터/AI';
  if (str.includes('예술') || str.includes('대중문화') || str.includes('미술') || str.includes('음악') || str.includes('영화') || str.includes('디자인') || str.includes('Art')) return '예술/대중문화';
  if (str.includes('종교') || str.includes('영성') || str.includes('기독교') || str.includes('불교') || str.includes('천주교') || str.includes('Religion')) return '종교/영성';
  if (str.includes('건강') || str.includes('취미') || str.includes('여행') || str.includes('요리') || str.includes('스포츠') || str.includes('다이어트') || str.includes('Travel')) return '건강/취미/여행';
  if (str.includes('청소년') || str.includes('아동') || str.includes('유아') || str.includes('어린이') || str.includes('동화') || str.includes('Children')) return '청소년/아동';
  if (str.includes('만화') || str.includes('웹툰') || str.includes('코믹') || str.includes('Comics') || str.includes('Manga')) return '만화/웹툰';
  if (str.includes('외국어') || str.includes('영어') || str.includes('수험서') || str.includes('자격증') || str.includes('학습') || str.includes('토익') || str.includes('Language')) return '외국어/학습';

  if (str.includes('문학')) return '소설';
  if (str.includes('기술과학')) return 'IT/컴퓨터/AI';
  if (str.includes('사회과학')) return '사회/정치/법';
  if (str.includes('자연과학')) return '자연/과학/공학';
  if (str.includes('언어')) return '외국어/학습';
  if (str.includes('총류')) return '인문학';

  return '기타';
}

function fetchAladinSingleIsbnInfo(singleIsbn) {
  return new Promise((resolve) => {
    if (!singleIsbn) return resolve(null);
    let cleanedIsbn = String(singleIsbn).replace(/[^0-9X]/gi, '');
    if (!cleanedIsbn || (cleanedIsbn.length !== 10 && cleanedIsbn.length !== 13)) {
      return resolve(null);
    }

    const cbName = 'aladin_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
    const script = document.createElement('script');
    
    const cleanup = () => {
      delete window[cbName];
      if (script && script.parentNode) {
        script.parentNode.removeChild(script);
      }
    };

    window[cbName] = function(data) {
      cleanup();
      try {
        if (data && !data.errorCode && data.item && data.item.length > 0) {
          const item = data.item[0];
          const itemPage = item.subInfo?.itemPage;
          const pageCount = (itemPage && !isNaN(itemPage) && parseInt(itemPage, 10) > 0) ? parseInt(itemPage, 10) : null;
          const desc = item.description ? item.description.trim() : null;
          const cat = item.categoryName ? parseCategoryToStandard(item.categoryName) : null;
          if (pageCount || desc || cat) {
            return resolve({ pageCount, description: desc, category: cat });
          }
        }
      } catch(e) {
        console.warn('알라딘 API 파싱 오류:', e);
      }
      resolve(null);
    };

    script.onerror = () => {
      cleanup();
      resolve(null);
    };

    const itemIdType = cleanedIsbn.length === 13 ? 'ISBN13' : 'ISBN';
    script.src = `https://www.aladin.co.kr/ttb/api/ItemLookUp.aspx?ttbkey=${ALADIN_TTB_KEY}&itemIdType=${itemIdType}&ItemId=${cleanedIsbn}&output=js&Version=20131101&callback=${cbName}`;
    document.body.appendChild(script);
  });
}

async function fetchAladinExtraInfo(isbn) {
  if (!isbn) return null;
  const parts = String(isbn).trim().split(/\s+/).filter(Boolean);
  for (let i = parts.length - 1; i >= 0; i--) {
    const info = await fetchAladinSingleIsbnInfo(parts[i]);
    if (info) return info;
  }
  return null;
}

async function fetchAladinPageCount(isbn) {

}

          }
        }

        let isbnVal = '';
        if (v.industryIdentifiers) {
          const isbnObj = v.industryIdentifiers.find(i => i.type === 'ISBN_13') || v.industryIdentifiers.find(i => i.type === 'ISBN_10');
          if (isbnObj) isbnVal = isbnObj.identifier;
        }

        let pubDateVal = v.publishedDate ? v.publishedDate.replace(/-/g, '.') : '';

        return {
          title: v.title || '',
          authors: Array.isArray(v.authors) ? v.authors.join(', ') : (v.authors || ''),
          publisher: v.publisher || '',
          contents: v.description || '',
          thumbnail: rawCover,
          isbn: isbnVal,
          page_count: v.pageCount || null,
          pubDate: pubDateVal,
          source: '구글 북스'
        };
      }).filter(b => b.thumbnail && b.thumbnail.trim().length > 15);
    } catch(e) {
      console.warn('구글 책 검색 오류:', e);
      return [];
    }
  })();

  // 3. 국립중앙도서관 Open API 동시 호출 Promise
  const nlPromise = (async () => {
    try {
      let nlSrchTarget = 'total';
      if (target === 'title') nlSrchTarget = 'title';
      else if (target === 'person') nlSrchTarget = 'author';
      else if (target === 'publisher') nlSrchTarget = 'publisher';

      const nlUrl = `https://www.nl.go.kr/NL/search/openApi/search.do?key=${NL_API_KEY}&kwd=${encodeURIComponent(query)}&srchTarget=${nlSrchTarget}&apiType=json&pageNum=1&pageSize=10`;
      const res = await fetch(nlUrl);
      if (!res.ok) return [];
      const data = await res.json();
      if (!data || !Array.isArray(data.result)) return [];

      return data.result.map(item => {
        const cleanTitle = (item.titleInfo || '').replace(/<[^>]*>/g, '').trim();
        const cleanAuthor = (item.authorInfo || '').trim();
        const cleanPub = (item.pubInfo || '').trim();
        let isbnVal = '';
        if (item.isbn) {
          const parts = item.isbn.trim().split(/\s+/);
          isbnVal = parts[parts.length - 1] || parts[0] || '';
        }
        let cover = null;
        if (item.imageUrl && item.imageUrl.trim()) {
          cover = item.imageUrl.startsWith('http') ? item.imageUrl : `https://www.nl.go.kr/${item.imageUrl.replace(/^\//, '')}`;
        }
        let pubDateVal = (item.pubYearInfo || '').trim() || (item.regDate ? item.regDate.slice(0, 4) : '');

        return {
          title: cleanTitle,
          authors: cleanAuthor,
          publisher: cleanPub,
          contents: item.placeInfo ? `소장위치: ${item.placeInfo} (${item.typeName || '도서'})` : (item.typeName || ''),
          thumbnail: cover,
          isbn: isbnVal,
          page_count: null,
          genre: item.kdcName1s ? parseCategoryToStandard(item.kdcName1s) : null,
          pubDate: pubDateVal,
          source: '국립중앙도서관'
        };
      }).filter(b => !!b.title);
    } catch(e) {
      console.warn('국립중앙도서관 책 검색 오류:', e);
      return [];
    }
  })();

  // 4. 알라딘 Open API 동시 호출 Promise
  const aladinPromise = fetchAladinSearchBooks(query, target);

  // 카카오, 구글, 국립중앙도서관, 알라딘 동시에 비동기 병렬 요청 처리 (Promise.allSettled)
  const results = await Promise.allSettled([kakaoPromise, googlePromise, nlPromise, aladinPromise]);
  const kakaoBooks = results[0].status === 'fulfilled' ? results[0].value : [];
  const googleBooks = results[1].status === 'fulfilled' ? results[1].value : [];
  const nlBooks = results[2].status === 'fulfilled' ? results[2].value : [];
  const aladinBooks = results[3].status === 'fulfilled' ? results[3].value : [];

  // 검색 결과 병합 및 스마트 중복 제거 & 판본 그룹화 (제목+저자+출판사 동일 시 판본으로 그룹핑)
  const merged = [];

  const cleanTitle = (str) => {
    let t = (str || '').toLowerCase();
    t = t.replace(/\([^)]*개정판[^)]*\)/g, '')
         .replace(/\([^)]*에디션[^)]*\)/g, '')
         .replace(/\([^)]*특별판[^)]*\)/g, '')
         .replace(/\([^)]*양장[^)]*\)/g, '')
         .replace(/\([^)]*무선[^)]*\)/g, '')
         .replace(/\([^)]*세트[^)]*\)/g, '')
         .replace(/\([^)]*전\d+권[^)]*\)/g, '');
    return t.replace(/[^a-z0-9가-힣]/g, '');
  };

  const cleanAuthor = (str) => {
    let a = (str || '').toLowerCase();
    a = a.replace(/\([^)]*\)/g, '').replace(/지은이|글|그림|옮긴이|역자|저자|원작/g, '');
    const parts = a.split(/[,·;\s]+/);
    return parts[0] ? parts[0].replace(/[^a-z0-9가-힣]/g, '') : '';
  };

  const cleanPublisher = (str) => {
    let p = (str || '').toLowerCase();
    p = p.replace(/\(주\)/g, '').replace(/주식회사/g, '').replace(/[^a-z0-9가-힣]/g, '');
    return p;
  };

  const getEditionGroupKey = (b) => {
    const t = cleanTitle(b.title);
    const a = cleanAuthor(b.authors);
    const p = cleanPublisher(b.publisher);
    return `${t}||${a}||${p}`;
  };

  const addBook = (b) => {
    const groupKey = getEditionGroupKey(b);
    const isbnKey = (b.isbn || '').trim();

    // 1. 완벽히 동일한 ISBN을 가진 중복 항목인 경우 보완만 처리
    let exactIndex = -1;
    if (isbnKey) {
      exactIndex = merged.findIndex(m => (m.isbn || '').trim() === isbnKey);
    }
    if (exactIndex >= 0) {
      if (!merged[exactIndex].thumbnail && b.thumbnail) merged[exactIndex].thumbnail = b.thumbnail;
      if (!merged[exactIndex].pubDate && b.pubDate) merged[exactIndex].pubDate = b.pubDate;
      if (!merged[exactIndex].page_count && b.page_count) merged[exactIndex].page_count = b.page_count;
      if ((!merged[exactIndex].contents || merged[exactIndex].contents.trim().length < 10) && b.contents && b.contents.trim().length >= 10) {
        merged[exactIndex].contents = b.contents;
      }
      if ((!merged[exactIndex].genre || merged[exactIndex].genre === '소설' || merged[exactIndex].genre === '기타') && b.genre && b.genre !== '소설' && b.genre !== '기타') {
        merged[exactIndex].genre = b.genre;
      }
      return;
    }

    // 2. 제목, 저자, 출판사가 동일한 다른 판본(출판일이 다름)인 경우 -> 판본 그룹(editions)으로 묶음
    let groupIndex = merged.findIndex(m => getEditionGroupKey(m) === groupKey);
    if (groupIndex >= 0) {
      const parent = merged[groupIndex];
      if (!parent.editions || !Array.isArray(parent.editions)) {
        parent.editions = [{ ...parent }];
      }
      const isAlreadyInEditions = parent.editions.some(e => 
        (e.isbn && b.isbn && e.isbn.trim() === b.isbn.trim()) || 
        (e.pubDate && b.pubDate && e.pubDate === b.pubDate)
      );
      if (!isAlreadyInEditions) {
        parent.editions.push(b);
      }
      return;
    }

    // 3. 신규 도서 등록 (자기 자신을 첫 번째 판본으로 세팅)
    b.editions = [{ ...b }];
    merged.push(b);
  };

  siteBooks.forEach(addBook);
  kakaoBooks.forEach(addBook);
  aladinBooks.forEach(addBook);
  googleBooks.forEach(addBook);

  // 국립중앙도서관 API는 독자적인 검색 결과 카드로 노출하지 않고, 검색 결과 도서 항목들의 데이터 보완(KDC 카테고리, 소장위치, 발행년도, 썸네일)에만 보충 활용
  if (nlBooks && nlBooks.length > 0) {
    merged.forEach(m => {
      const mIsbn = (m.isbn || '').trim();
      const mTitle = (m.title || '').trim().toLowerCase();

      const nlMatch = nlBooks.find(nl => {
        const nlIsbn = (nl.isbn || '').trim();
        const nlTitle = (nl.title || '').trim().toLowerCase();
        return (mIsbn && nlIsbn && mIsbn === nlIsbn) || (mTitle && nlTitle && (mTitle.includes(nlTitle) || nlTitle.includes(mTitle)));
      });

      if (nlMatch) {
        if (!m.pubDate && nlMatch.pubDate) m.pubDate = nlMatch.pubDate;
        if ((!m.genre || m.genre === '소설' || m.genre === '기타') && nlMatch.genre && nlMatch.genre !== '소설' && nlMatch.genre !== '기타') {
          m.genre = nlMatch.genre;
        }
        if (!m.thumbnail && nlMatch.thumbnail) m.thumbnail = nlMatch.thumbnail;
        if (nlMatch.contents && nlMatch.contents.includes('소장위치:')) {
          m.placeInfo = nlMatch.contents;
        }
      }
    });
  }

  return merged;
}

    const books = await fetchMultiSourceBooks(q, target);

        }
        const isbnInput = document.getElementById('rg-isbn');
        if (isbnInput) isbnInput.value = kb.isbn || '';
        tempRegisterCover = kb.thumbnail || null;

        let pages = extractPageCount(kb);

                ${kb.thumbnail ? `<img src="${kb.thumbnail}" id="rg-cover-preview-img" style="width:100%; height:100%; object-fit:cover; border-radius:3px;">` : `<div style="width:100%; height:100%; background:linear-gradient(135deg, var(--accent) 0%, #D97706 100%); display:flex; align-items:center; justify-content:center; color:#FFF; font-size:32px;">📖</div>`}
              </div>
              <div style="font-size:17px; font-weight:900; color:var(--ink-main); line-height:1.35; max-width:92%; word-break:keep-all;">
                ${esc(kb.title)}
              </div>
              <div style="font-size:12.5px; color:var(--ink-muted); font-weight:500; line-height:1.45; max-width:92%; word-break:keep-all;">
                ✍️ ${esc(kb.authors || '저자 미상')} · 🏢 ${esc(kb.publisher || '출판사 미상')}${kb.pubDate ? ` (${esc(kb.pubDate)})` : ''}
              </div>
              ${kb.isbn ? `<div style="font-size:11.5px; color:var(--accent); font-weight:700; margin-top:-2px;">🏷️ ISBN: ${esc(kb.isbn)}</div>` : ''}
            </div>
          `;
        }
        const coverUrlInput = document.getElementById('rg-cover-url');
        if (coverUrlInput) coverUrlInput.value = kb.thumbnail || '';

        if (kb.isbn) {
          fetchAladinExtraInfo(kb.isbn).then(aladinInfo => {
            if (aladinInfo) {
              if (aladinInfo.pageCount) {
                kb.page_count = aladinInfo.pageCount;
                if (totalInput) totalInput.value = aladinInfo.pageCount;
              }
              if (aladinInfo.description && (!descInput.value || descInput.value.trim().length < 10)) {
                descInput.value = aladinInfo.description;
                kb.contents = aladinInfo.description;
              }
              if (aladinInfo.category && categoryInput) {
                categoryInput.value = aladinInfo.category;
                kb.genre = aladinInfo.category;
              }
            }
          });
        }
      }
    };

    document.querySelectorAll('[data-kbook-idx]').forEach(el => {
      el.onclick = (e) => {
        const idx = parseInt(el.dataset.kbookIdx, 10);
        const bookObj = books[idx];
        if (!bookObj) return;

        if (bookObj.editions && bookObj.editions.length > 1) {
          openEditionModal(bookObj, (selectedEd) => {
            selectBookEdition(selectedEd);
          });
        } else {
          selectBookEdition(bookObj);
        }
      };
    });
  } catch (e) {
    if (resBox) resBox.innerHTML = '<div class="form-hint" style="text-align:center; padding:20px;">검색 API 연동 실패 (잠시 후 다시 검색해 주세요)</div>';
  }
}

function submitRegister() {
  const title = document.getElementById('rg-title')?.value.trim();
  const creator = document.getElementById('rg-creator')?.value.trim();
  const publisher = document.getElementById('rg-publisher')?.value.trim();
  const category = document.getElementById('rg-category')?.value || '소설';
  const totalVal = document.getElementById('rg-total')?.value;
  const desc = document.getElementById('rg-desc')?.value.trim();
  const totalPoint = totalVal ? parseInt(totalVal, 10) : 300;

  if (!title) { toast('책 제목을 입력해 주세요.'); return; }

  // 이미 우리 사이트 DB에 존재하는 도서인지 확인 후 기존 도서 재활용
  let existingContent = db.contents.find(c =>
    (tempRegisterSiteContentId && c.id === tempRegisterSiteContentId) ||
    (tempRegisterIsbn && c.isbn && c.isbn.trim() === tempRegisterIsbn.trim()) ||
    (c.title && title && c.title.trim().toLowerCase() === title.toLowerCase() && c.creator && creator && c.creator.trim().toLowerCase() === creator.toLowerCase()) ||
    (c.title && title && c.title.trim().toLowerCase() === title.toLowerCase() && !creator)
  );

  const isNewSiteBook = !existingContent;
  const id = existingContent ? existingContent.id : uid('c');
  if (!existingContent) {
    db.contents.push({ id, type: 'BOOK', title, creator: creator || '저자 미상', publisher: publisher || '출판사 미상', genre: category, isbn: tempRegisterIsbn || '', pubDate: tempRegisterPubDate || '', totalPoint, description: desc || '', cover: tempRegisterCover || null, sourceProvider: tempRegisterSourceProvider || '추가 입력' });
    if (!db.user) db.user = {};
    db.user.hasRegisteredFirstBook = true;
    db.user.frontierCount = (db.user.frontierCount || 0) + 1;
  } else {
    if (publisher && publisher !== '출판사 미상') existingContent.publisher = publisher;
    if (tempRegisterCover && !existingContent.cover) existingContent.cover = tempRegisterCover;
    if (desc && (!existingContent.description || existingContent.description.length < desc.length)) existingContent.description = desc;
    if (tempRegisterSourceProvider && !existingContent.sourceProvider) existingContent.sourceProvider = tempRegisterSourceProvider;
    if (tempRegisterIsbn && !existingContent.isbn) existingContent.isbn = tempRegisterIsbn;
    if (tempRegisterPubDate && !existingContent.pubDate) existingContent.pubDate = tempRegisterPubDate;
  }
  
  // 내 서재 독서 상태 '읽는 중(ACTIVE)'으로 자동 등록
  let myCont = db.myContent.find(m => m.contentId === id);
  if (!myCont) {
    db.myContent.push({
      contentId: id,
      status: 'ACTIVE',
      currentPoint: 0,
      startDate: new Date().toISOString().slice(0, 10).replace(/-/g, '.'),
      finishDate: null,
      lastActivePoint: 0
    });
  } else {
    myCont.status = 'ACTIVE';
  }

  tempRegisterCover = null;
  tempRegisterSiteContentId = null;
  saveDB();

  if (isNewSiteBook) {
    toast(`🎉 우리 DB에 없는 책을 처음 등록하셨습니다! [🌱 프론티어] 등급을 달성하셨습니다!`);
  } else {
    toast(`'${title}'을(를) '읽는 중' 서재에 등록했습니다!`);
  }
  state.overlayStack = [{ type: 'detail', contentId: id }];
  render();
}
