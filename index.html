    function showBarcodeOverlapPopup(evt, nearbyMarks, barcodeWrap) {
      document.querySelectorAll('.barcode-overlap-popup').forEach(el => el.remove());

      const popup = document.createElement('div');
      popup.className = 'barcode-overlap-popup';

      const MARK_COLORS = ['#F59E0B', '#EF4444', '#10B981', '#6366F1', '#EC4899', '#8B5CF6', '#06B6D4', '#F97316'];

      let itemsHtml = nearbyMarks.map((mk, idx) => {
        const color = MARK_COLORS[idx % MARK_COLORS.length];
        const previewText = esc(mk.text ? (mk.text.length > 20 ? mk.text.slice(0, 20) + '...' : mk.text) : (mk.review || '기록 문장'));
        const author = esc(mk.nickname || '나');
        return `
          <div class="popup-item" data-popup-post-id="${mk.id}" data-popup-point="${mk.point}" data-popup-mine="${mk.mine ? '1' : '0'}" style="display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:5px; cursor:pointer; margin-bottom:3px; transition:background 0.15s;">
            <span style="background:${color}; color:#FFF; font-size:10.5px; font-weight:800; padding:2px 6px; border-radius:3px; flex-shrink:0;">${mk.point}p</span>
            <div style="overflow:hidden;">
              <div style="font-size:12px; font-weight:700; color:var(--ink-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">"${previewText}"</div>
              <div style="font-size:10px; color:var(--ink-muted); font-weight:500;">작성자: ${author}</div>
            </div>
          </div>
        `;
      }).join('');

      popup.innerHTML = `
        <div style="font-size:11px; font-weight:800; color:var(--ink-muted); padding:3px 4px 6px; border-bottom:1px solid var(--line-subtle); margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
          <span>📍 겹친 기록 선택 (${nearbyMarks.length}개)</span>
          <span style="cursor:pointer; font-size:12px; padding:2px 6px;" onclick="this.closest('.barcode-overlap-popup').remove()">✕</span>
        </div>
        <div style="max-height:180px; overflow-y:auto;">
          ${itemsHtml}
        </div>
      `;

      document.body.appendChild(popup);

      const rect = barcodeWrap.getBoundingClientRect();
      const clickX = evt.changedTouches ? evt.changedTouches[0].clientX : (evt.clientX || (rect.left + rect.width / 2));
      let leftPos = Math.max(10, Math.min(window.innerWidth - 290, clickX - 100));
      let topPos = rect.top - 140;
      if (topPos < 50) topPos = rect.bottom + 10;

      popup.style.left = leftPos + 'px';
      popup.style.top = topPos + 'px';

      popup.querySelectorAll('[data-popup-post-id]').forEach(item => {
        item.onclick = (e) => {
          e.stopPropagation();
          const postId = item.dataset.popupPostId;
          const postPoint = item.dataset.popupPoint;
          const isMine = item.dataset.popupMine === '1';

          popup.remove();

          const targetTab = isMine ? 'MY' : 'COMMUNITY';
          if ((state.detailTab || 'MY') !== targetTab) {
            state.detailTab = targetTab;
            render();
          }

          setTimeout(() => {
            const cardEl = document.getElementById('post-card-' + postId);
            if (cardEl) {
              cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
              cardEl.style.transition = 'all 0.3s ease';
              cardEl.style.outline = '2px solid var(--accent)';
              cardEl.style.boxShadow = '0 0 14px rgba(180, 83, 9, 0.4)';
              setTimeout(() => {
                cardEl.style.outline = 'none';
                cardEl.style.boxShadow = 'var(--shadow-sm)';
              }, 1800);
              toast(`📖 ${postPoint ? postPoint + 'p ' : ''}기록 위치로 이동했습니다.`);
            }
          }, 50);
        };
      });

      setTimeout(() => {
        function closePopup(e) {
          if (!popup.contains(e.target)) {
            popup.remove();
            document.removeEventListener('click', closePopup);
          }
        }
        document.addEventListener('click', closePopup);
      }, 10);
    }

    const barcodeWrap = document.getElementById('detailBarcodeWrap');
    if (barcodeWrap && c && m) {
      const totalPoint = c.totalPoint || 1;
      const cursorLine = barcodeWrap.querySelector('.cursor-line');
      const ticks = barcodeWrap.querySelectorAll('.ticks i');
      const pctText = document.getElementById('detailPctText');
      const pageBadge = document.getElementById('detailPageBadge');
      
      let isDragging = false;
      let hasDragged = false;
      let startX = 0;
      let startY = 0;
      let initialTarget = null;
      let dragTargetPage = m.currentPoint || 0;

      let dragTooltip = barcodeWrap.querySelector('.drag-tooltip');
      if (!dragTooltip) {
        dragTooltip = document.createElement('div');
        dragTooltip.className = 'drag-tooltip';
        dragTooltip.style.cssText = 'position:absolute; top:-26px; transform:translateX(-50%); background:var(--accent); color:#FFF; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:3px; display:none; z-index:10; pointer-events:none; box-shadow:0 2px 6px rgba(0,0,0,0.2); white-space:nowrap;';
        barcodeWrap.appendChild(dragTooltip);
      }

      function updateDragPosition(clientX) {
        const rect = barcodeWrap.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        dragTargetPage = Math.round(ratio * totalPoint);
        const curPct = Math.min(Math.round((dragTargetPage / totalPoint) * 100), 100);

        if (cursorLine) cursorLine.style.left = (ratio * 100) + '%';
        if (pctText) pctText.textContent = curPct + '%';
        if (pageBadge) pageBadge.textContent = `${dragTargetPage}p`;

        if (ticks && ticks.length > 0) {
          const tickCount = ticks.length;
          ticks.forEach((tick, idx) => {
            const isRead = ((idx + 1) / tickCount) * 100 <= curPct;
            tick.className = isRead ? 'read-tick' : 'unread-tick';
          });
        }

        if (dragTooltip) {
          dragTooltip.style.display = 'block';
          dragTooltip.style.left = (ratio * 100) + '%';
          dragTooltip.textContent = `${dragTargetPage}p (${curPct}%)`;
        }
      }

      function onMove(evt) {
        if (!isDragging) return;
        const cx = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const cy = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const dist = Math.hypot(cx - startX, cy - startY);
        if (dist > 5) {
          hasDragged = true;
        }
        if (hasDragged) {
          updateDragPosition(cx);
        }
      }

      function onEnd(evt) {
        if (!isDragging) return;
        isDragging = false;
        barcodeWrap.style.cursor = 'grab';
        if (dragTooltip) dragTooltip.style.display = 'none';

        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onEnd);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onEnd);

        if (hasDragged) {
          // Dragged -> Update reading page
          m.currentPoint = dragTargetPage;
          if (dragTargetPage >= totalPoint) {
            m.status = 'DONE';
            if (!m.finishDate) m.finishDate = '2026.07.19';
          } else {
            // 다 읽었어요 상태여도 드래그해서 바코드가 줄어들면 '읽는 중'으로 변경
            m.status = 'ACTIVE';
          }
          saveDB();
          toast(`독서 페이지가 ${dragTargetPage}p(으)로 설정되었습니다.`);
          render();
        } else {
          // Simple click -> Check if clicked on/near overlapping colored line marks for active tab
          const isMineTab = (state.detailTab || 'MY') === 'MY';
          const allBookPosts = db.posts.filter(p => p.contentId === c.id && p.point != null && (isMineTab ? !!p.mine : !p.mine));
          const clickX = evt.changedTouches ? evt.changedTouches[0].clientX : (evt.clientX || startX);
          const rect = barcodeWrap.getBoundingClientRect();
          const clickPct = Math.max(0, Math.min(100, ((clickX - rect.left) / rect.width) * 100));

          const markEl = initialTarget ? initialTarget.closest('[data-post-id]') : null;

          let nearbyMarks = [];
          if (markEl) {
            const clickedPoint = parseFloat(markEl.dataset.postPoint);
            const clickedPct = (clickedPoint / totalPoint) * 100;
            nearbyMarks = allBookPosts.filter(p => {
              const pPct = (p.point / totalPoint) * 100;
              return Math.abs(pPct - clickedPct) <= 5.0;
            });
          } else {
            nearbyMarks = allBookPosts.filter(p => {
              const pPct = (p.point / totalPoint) * 100;
              return Math.abs(pPct - clickPct) <= 4.0;
            });
          }

          if (nearbyMarks.length > 1) {
            showBarcodeOverlapPopup(evt, nearbyMarks, barcodeWrap);
          } else if (nearbyMarks.length === 1) {
            const mk = nearbyMarks[0];
            const targetTab = mk.mine ? 'MY' : 'COMMUNITY';
            if ((state.detailTab || 'MY') !== targetTab) {
              state.detailTab = targetTab;
              render();
            }
            setTimeout(() => {
              const cardEl = document.getElementById('post-card-' + mk.id);
              if (cardEl) {
                cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                cardEl.style.transition = 'all 0.3s ease';
                cardEl.style.outline = '2px solid var(--accent)';
                cardEl.style.boxShadow = '0 0 14px rgba(180, 83, 9, 0.4)';
                setTimeout(() => {
                  cardEl.style.outline = 'none';
                  cardEl.style.boxShadow = 'var(--shadow-sm)';
                }, 1800);
                toast(`📖 ${mk.point}p 기록 위치로 이동했습니다.`);
              }
            }, 50);
          } else {
            render();
          }
        }
      }

      function startDrag(e) {
        isDragging = true;
        hasDragged = false;
        initialTarget = e.target;
        barcodeWrap.style.cursor = 'grabbing';
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);
      }

      barcodeWrap.addEventListener('mousedown', startDrag);
      barcodeWrap.addEventListener('touchstart', startDrag, { passive: true });
    }

    const detailBackBtn = document.getElementById('detailBackBtn');
    if (detailBackBtn) detailBackBtn.onclick = popOverlay;

    const detailMoreBtn = document.getElementById('detailMoreBtn');
    const detailMoreDropdown = document.getElementById('detailMoreDropdown');
    if (detailMoreBtn && detailMoreDropdown) {
      detailMoreBtn.onclick = (e) => {
        e.stopPropagation();
        detailMoreDropdown.style.display = detailMoreDropdown.style.display === 'none' ? 'block' : 'none';
      };
      document.addEventListener('click', function closeDrop() {
        if (detailMoreDropdown) detailMoreDropdown.style.display = 'none';
        document.removeEventListener('click', closeDrop);
      });
    }

    const editBookBtn = document.getElementById('editBookBtn');
    if (editBookBtn && c) {
      editBookBtn.onclick = () => {
        if (detailMoreDropdown) detailMoreDropdown.style.display = 'none';

        // 위키 수정 권한 체크: 내가 서재에 등록하고 독서(또는 보관) 중인 책이어야 함
        const isMyBook = db.myContent && db.myContent.some(m => m.contentId === c.id);
        if (!isMyBook) {
          toast('내가 서재에 등록하고 읽는 중(또는 보관 중)인 책만 위키 정보를 수정할 수 있습니다.');
          return;
        }

        // 완독자 10명 이상인 도서는 수정 불가 잠금 처리
        const completedCount = (db.myContent || []).filter(m => m.contentId === c.id && m.status === 'COMPLETED').length;
        if (completedCount >= 10) {
          toast(`🔒 완독한 독자가 10명 이상(현재 ${completedCount}명)인 도서는 정보 보호를 위해 수정을 할 수 없습니다.`);
          return;
        }

        pushOverlay({ type: 'editBook', contentId: c.id });
      };
    }

    const deleteBookBtn = document.getElementById('deleteBookBtn');
    if (deleteBookBtn && c) {
      deleteBookBtn.onclick = () => {
        if (confirm(`'${c.title}' 책과 작성한 내 기록을 정말로 삭제하시겠습니까?`)) {
          const targetId = c.id;
          db.myContent = db.myContent.filter(x => x.contentId !== targetId);
          db.posts = db.posts.filter(x => x.contentId !== targetId);
          cleanupUnusedBook(targetId);
          saveDB();
          popOverlay();
        }
      };
    }

    function updateStatusAndProgress(st) {
      if (!c) return;
      let my = getMy(c.id);

      // Re-click active status button -> CANCEL / TOGGLE OFF STATUS!
      if (my && my.status === st) {
        const targetId = c.id;
        db.myContent = db.myContent.filter(x => x.contentId !== targetId);
        cleanupUnusedBook(targetId);
        saveDB();
        toast('독서 상태 선택이 해제되었습니다.');
        render();
        return;
      }

      // Add or update status entry in db.myContent
      if (!my) {
        my = { contentId: c.id, status: st, currentPoint: 0, startDate: '2026.06.14' };
        db.myContent.push(my);
      } else {
        my.status = st;
      }

      const total = c.totalPoint || 1;

      if (st === 'WANT') {
        my.currentPoint = 0;
        toast("'보관함'에 추가되었습니다.");
      } else if (st === 'DONE') {
        my.currentPoint = total;
        if (!my.finishDate) my.finishDate = '2026.07.19';
        toast("'완독'(으)로 상태가 설정되었습니다.");
      } else if (st === 'ACTIVE') {
        if (my.currentPoint === 0 || my.currentPoint >= total) {
          my.currentPoint = my.lastActivePoint || Math.round(total * 0.5) || 1;
        }
        my.lastActivePoint = my.currentPoint;
        toast("'읽는 중'(으)로 상태가 설정되었습니다.");
      }

      saveDB();
      render();
    }

    document.querySelectorAll('[data-setstatus]').forEach(btn => {
      btn.onclick = () => {
        const st = btn.dataset.setstatus;
        updateStatusAndProgress(st);
      };
    });

    function handlePointChange(newPoint) {
      if (!c) return;
      let my = getMy(c.id);
      if (!my) {
        my = { contentId: c.id, status: 'ACTIVE', currentPoint: 0, startDate: '2026.06.14' };
        db.myContent.push(my);
      }
      const total = c.totalPoint || 1;
      const val = Math.max(0, Math.min(total, newPoint));
      my.currentPoint = val;

      if (val === 0) {
        my.status = 'WANT';
      } else if (val >= total) {
        my.status = 'DONE';
        if (!my.finishDate) my.finishDate = '2026.07.19';
      } else {
        my.status = 'ACTIVE';
        my.lastActivePoint = val;
      }
      saveDB();
      render();
    }

    const stepMinus = document.getElementById('stepMinus');
    const stepPlus = document.getElementById('stepPlus');
    const stepCurInput = document.getElementById('stepCurInput');
    const stepTotalInput = document.getElementById('stepTotalInput');

    if (stepMinus) {
      stepMinus.onclick = () => {
        let my = getMy(c.id);
        handlePointChange((my ? (my.currentPoint || 0) : 0) - 1);
      };
    }
    if (stepPlus) {
      stepPlus.onclick = () => {
        let my = getMy(c.id);
        handlePointChange((my ? (my.currentPoint || 0) : 0) + 1);
      };
    }
    if (stepCurInput) {
      stepCurInput.onchange = () => {
        const val = parseInt(stepCurInput.value, 10);
        if (!isNaN(val)) handlePointChange(val);
      };
    }
    if (stepTotalInput && c) {
      stepTotalInput.onchange = () => {
        const val = parseInt(stepTotalInput.value, 10);
        if (!isNaN(val) && val > 0) {
          c.totalPoint = val;
          if ((m.currentPoint || 0) >= val) {
            m.currentPoint = val;
            m.status = 'DONE';
          }
          saveDB();
          render();
        }
      };
    }

    const openProgressModalBtn = document.getElementById('openProgressModalBtn');
    if (openProgressModalBtn && c) {
      openProgressModalBtn.onclick = () => {
        openModal({ type: 'changeProgress', contentId: c.id });
      };
    }

    const detailNewRecordBtn = document.getElementById('detailNewRecordBtn');
    if (detailNewRecordBtn) {
      detailNewRecordBtn.onclick = () => {
        postForm = { memoType: 'QUOTE', page: '', text: '', rating: 0, spoiler: false };
        openModal({ type: 'post', contentId: ov.contentId });
      };
    }

    document.querySelectorAll('[data-detailtab]').forEach(btn => {
      btn.onclick = () => {
        state.detailTab = btn.dataset.detailtab;
        render();
      };
    });

    document.querySelectorAll('[data-delmemo]').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.delmemo;
        if (confirm('이 기록을 삭제하시겠습니까?')) {
          const targetPost = db.posts.find(p => p.id === id);
          const targetContentId = targetPost ? targetPost.contentId : null;
          db.posts = db.posts.filter(p => p.id !== id);
          if (targetContentId) cleanupUnusedBook(targetContentId);
          saveDB();
          render();
        }
      };
    });
  }

  if (currentOvType === 'editBook') {
    const c = getContent(ov.contentId);
    if (c) {
      const editCoverInput = document.getElementById('edit-cover');
      const editCoverPreviewBox = document.getElementById('edit-cover-preview-box');
      const updateCoverPreview = () => {
        if (!editCoverInput || !editCoverPreviewBox) return;
        const url = editCoverInput.value.trim();
        if (url) {
          editCoverPreviewBox.innerHTML = `<img src="${esc(url)}" style="width:100%; height:100%; object-fit:cover;" onerror="this.parentNode.innerHTML='<span style=\\'font-size:11px; color:var(--danger, #DC2626); font-weight:700;\\'>오류</span>'">`;
        } else {
          editCoverPreviewBox.innerHTML = '<span style="font-size:24px;">🖼️</span>';
        }
      };
      if (editCoverInput) editCoverInput.addEventListener('input', updateCoverPreview);

      // 실제 변경된 항목만 선택 적용하는 도우미 함수
      const applyModifiedFieldsToForm = (targetHist) => {
        if (!targetHist) return;
        const keys = targetHist.changedKeys;
        const editCover = document.getElementById('edit-cover');
        const editCategory = document.getElementById('edit-category');
        const editTotal = document.getElementById('edit-total');
        const editDesc = document.getElementById('edit-desc');

        const appliedNames = [];

        if (Array.isArray(keys) && keys.length > 0) {
          if (keys.includes('cover') && editCover) {
            editCover.value = targetHist.cover || '';
            updateCoverPreview();
            appliedNames.push('표지');
          }
          if (keys.includes('genre') && editCategory) {
            editCategory.value = targetHist.genre || '소설';
            appliedNames.push('카테고리');
          }
          if (keys.includes('totalPoint') && editTotal) {
            editTotal.value = targetHist.totalPoint || 300;
            appliedNames.push('페이지');
          }
          if (keys.includes('description') && editDesc) {
            editDesc.value = targetHist.description || '';
            appliedNames.push('소개글');
          }
        } else {
          // 구 버전 기록이거나 changedKeys가 없으면 스냅샷 값으로 갱신
          if (editCover && targetHist.cover !== undefined) { editCover.value = targetHist.cover || ''; updateCoverPreview(); }
          if (editCategory && targetHist.genre) editCategory.value = targetHist.genre;
          if (editTotal && targetHist.totalPoint) editTotal.value = targetHist.totalPoint;
          if (editDesc && targetHist.description !== undefined) editDesc.value = targetHist.description;
          appliedNames.push(targetHist.changeSummary || '수정 항목');
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
        toast(`[${appliedNames.join(', ')}] 수정된 항목만 입력 필드에 바로 적용되었습니다.`);
      };

      // 히스토리 항목 클릭 시 수정된 항목만 선택 적용
      document.querySelectorAll('.hist-item-row').forEach(row => {
        row.onclick = () => {
          const histId = row.dataset.histid;
          const targetHist = (db.bookHistory || []).find(h => h.id === histId);
          if (!targetHist) return;

          applyModifiedFieldsToForm(targetHist);

          document.querySelectorAll('.hist-item-row').forEach(r => {
            r.style.borderColor = 'var(--line-subtle)';
            r.style.boxShadow = 'none';
          });
          row.style.borderColor = 'var(--accent)';
          row.style.boxShadow = '0 0 0 1px var(--accent)';
        };
      });

      // 복구 버튼
      document.querySelectorAll('.restore-hist-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const histId = btn.dataset.histid;
          const targetHist = (db.bookHistory || []).find(h => h.id === histId);
          if (targetHist && confirm(`이 히스토리 버전의 수정 항목만 폼 입력란에 복구하여 적용하시겠습니까?`)) {
            applyModifiedFieldsToForm(targetHist);
          }
        };
      });

      // 신고 버튼 🚨
      document.querySelectorAll('.report-hist-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const histId = btn.dataset.histid;
          const targetHist = (db.bookHistory || []).find(h => h.id === histId);
          if (targetHist && confirm(`이 수정 내역(작성자: ${targetHist.editorName || '나'}, ${targetHist.editedAt})을 부적절한 정보로 신고하시겠습니까?`)) {
            toast(`🚨 해당 수정 내역이 신고 접수되었습니다. 관리자 검토 후 조치됩니다.`);
          }
        };
      });

      // 히스토리 삭제 버튼 🗑️ (관리자 전용)
      document.querySelectorAll('.del-hist-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const histId = btn.dataset.histid;
          const targetHist = (db.bookHistory || []).find(h => h.id === histId);
          if (targetHist && confirm(`이 수정 히스토리 기록(${targetHist.changeSummary || '수정 항목'}, ${targetHist.editedAt})을 관리자 권한으로 완전히 삭제하시겠습니까?`)) {
            db.bookHistory = (db.bookHistory || []).filter(h => h.id !== histId);
            saveDB();
            toast(`🗑️ 해당 수정 히스토리가 완전히 삭제되었습니다.`);
            render();
          }
        };
      });

      const editSubmitBtn = document.getElementById('edit-submit-btn');
      if (editSubmitBtn) {
        editSubmitBtn.onclick = () => {
          const coverUrl = document.getElementById('edit-cover')?.value.trim() || null;
          const category = document.getElementById('edit-category')?.value || '소설';
          const totalVal = document.getElementById('edit-total')?.value;
          const desc = document.getElementById('edit-desc')?.value.trim();

          const changedNames = [];
          const changedKeys = [];

          if ((c.cover || '') !== (coverUrl || '')) { changedNames.push('표지'); changedKeys.push('cover'); }
          if ((c.genre || '') !== category) { changedNames.push('카테고리'); changedKeys.push('genre'); }
          if ((c.totalPoint || 300) !== (totalVal ? parseInt(totalVal, 10) : 300)) { changedNames.push('페이지'); changedKeys.push('totalPoint'); }
          if ((c.description || '') !== desc) { changedNames.push('소개글'); changedKeys.push('description'); }

          const changeSummary = changedNames.length > 0 ? changedNames.join(', ') : '정보 수정';

          c.cover = coverUrl;
          c.genre = category;
          c.totalPoint = totalVal ? parseInt(totalVal, 10) : (c.totalPoint || 300);
          c.description = desc || '';

          const snapshot = {
            id: uid('hist'),
            contentId: c.id,
            title: c.title || '',
            creator: c.creator || '',
            publisher: c.publisher || '',
            cover: c.cover || null,
            genre: c.genre || '소설',
            totalPoint: c.totalPoint || 300,
            description: c.description || '',
            changedKeys: changedKeys,
            changeSummary: changeSummary,
            editorName: '나',
            editedAt: new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
          };

          if (!db.bookHistory) db.bookHistory = [];
          db.bookHistory.unshift(snapshot);

          saveDB();
          toast('책 정보가 수정되고 이력이 저장되었습니다.');
          popOverlay();
        };
      }
    }
  }
}

/* ---------- Global Tab Navigation Click Handler ---------- */
document.querySelectorAll('nav.bottom-nav button').forEach(b => {
  b.onclick = () => {
    closeAllOverlays();
    closeModal();
    state.tab = b.dataset.tab;
    if (b.dataset.tab === 'library') {
      state.libFilter = 'ACTIVE';
    }
    render();
  };
});

// Close card & collection dropdown menus on click outside anywhere
document.addEventListener('click', (e) => {
  let needsRender = false;
  if (state.openCardMenuId && !e.target.closest('.card-menu-wrap')) {
    state.openCardMenuId = null;
    needsRender = true;
  }
  if (state.openCollectionMenuId && !e.target.closest('.col-menu-wrap')) {
    state.openCollectionMenuId = null;
    needsRender = true;
  }
  if (needsRender) render();
}, true);

// Initial Render
render();
if (typeof initAuthObserver === 'function') {
  initAuthObserver();
}
if (typeof syncFromSupabase === 'function') {
  syncFromSupabase();
}
</script>
</body>
</html>
