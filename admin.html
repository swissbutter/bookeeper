<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>문장수집가 — 관리자 센터 (Admin Dashboard)</title>
  <meta name="description" content="문장수집가 통합 관리자 센터 - 책 정보 수정/삭제, 신고 모니터링, 회원 관리 및 통계 대시보드">
  
  <!-- Fonts & Chart.js CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-dark: #0F172A;
      --card-dark: #1E293B;
      --card-border: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --accent-primary: #6366F1;
      --accent-hover: #4F46E5;
      --accent-orange: #F59E0B;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --accent-purple: #8B5CF6;
      --paper-bg: #0F172A;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --radius: 10px;
    }

    [data-theme="light"] {
      --bg-dark: #F8F6F2;
      --card-dark: #FFFFFF;
      --card-border: #E2E8F0;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --accent-primary: #4F46E5;
      --accent-hover: #4338CA;
      --accent-orange: #D97706;
      --accent-green: #059669;
      --accent-red: #DC2626;
      --accent-purple: #7C3AED;
      --paper-bg: #F1F5F9;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Layout Structure */
    .admin-wrapper {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 260px;
      background-color: var(--card-dark);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 8px 24px 8px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-radius: var(--radius);
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 13.5px;
      background: transparent;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: all 0.2s ease;
    }

    .nav-item:hover {
      background-color: rgba(99, 102, 241, 0.1);
      color: var(--accent-primary);
    }

    .nav-item.active {
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-hover));
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
    }

    .nav-label {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-badge {
      padding: 2px 7px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      background-color: var(--card-border);
      color: var(--text-main);
    }

    .nav-badge.danger {
      background-color: var(--accent-red);
      color: #FFFFFF;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .sidebar-footer {
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      border-radius: var(--radius);
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 700;
      font-size: 12.5px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: var(--text-muted);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow-x: hidden;
    }

    /* Top Bar */
    .top-bar {
      height: 70px;
      background-color: var(--card-dark);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-title h1 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

    .header-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.12);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-green);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Button Styles */
    .btn {
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent-primary);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background-color: var(--accent-red);
      color: #FFFFFF;
    }
    .btn-danger:hover {
      background-color: #DC2626;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .btn-success {
      background-color: var(--accent-green);
      color: #FFFFFF;
    }
    .btn-success:hover {
      background-color: #059669;
    }

    .btn-warning {
      background-color: var(--accent-orange, #F59E0B);
      color: #FFFFFF;
    }
    .btn-warning:hover {
      background-color: #D97706;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 11.5px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Tab Container */
    .view-container {
      padding: 24px 28px;
      flex: 1;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-primary);
    }

    .metric-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-value {
      font-size: 26px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .metric-sub {
      font-size: 11.5px;
      margin-top: 6px;
      color: var(--text-muted);
    }

    .metric-sub.up { color: var(--accent-green); font-weight: 700; }
    .metric-sub.alert { color: var(--accent-red); font-weight: 700; }

    /* Chart Grid */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1024px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .chart-header h3 {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-main);
    }

    .chart-body {
      position: relative;
      height: 240px;
    }

    /* Table & Data Controls */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-input {
      width: 100%;
      padding: 9px 14px 9px 36px;
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .select-filter {
      padding: 9px 12px;
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .data-table-card {
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--card-border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      font-size: 13px;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Badges & Tags */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
    }

    .badge-primary { background: rgba(99, 102, 241, 0.15); color: var(--accent-primary); }
    .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .badge-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-orange); }
    .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
    .badge-muted { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background-color: var(--card-dark);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      padding: 24px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-header h3 {
      font-size: 16.5px;
      font-weight: 800;
    }

    .close-modal-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--paper-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-primary);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background-color: var(--card-dark);
      border: 1px solid var(--accent-primary);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="admin-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">👑</div>
        <div>
          <div class="brand-title">문장수집가</div>
          <div class="brand-sub">관리자 센터 v2.0</div>
        </div>
      </div>

      <nav class="nav-menu">
        <button class="nav-item active" data-tab="dashboard">
          <span class="nav-label"><span>📊</span> 대시보드 & 통계</span>
        </button>
        <button class="nav-item" data-tab="books">
          <span class="nav-label"><span>📚</span> 도서 정보 관리</span>
          <span class="nav-badge" id="badge-books">0</span>
        </button>
        <button class="nav-item" data-tab="reports">
          <span class="nav-label"><span>🚨</span> 신고 모니터링</span>
          <span class="nav-badge danger" id="badge-reports">0</span>
        </button>
        <button class="nav-item" data-tab="users">
          <span class="nav-label"><span>👥</span> 회원 & 계급/차단</span>
          <span class="nav-badge" id="badge-users">0</span>
        </button>
        <button class="nav-item" data-tab="posts">
          <span class="nav-label"><span>✍️</span> 포스트 & 댓글</span>
          <span class="nav-badge" id="badge-posts">0</span>
        </button>
        <button class="nav-item" data-tab="announcements">
          <span class="nav-label"><span>📢</span> 공지사항 관리</span>
        </button>
        <button class="nav-item" data-tab="settings">
          <span class="nav-label"><span>⚙️</span> DB 백업 & 감사 로그</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <a href="index.html" class="back-btn">
          <span>🏠</span> 메인 앱으로 돌아가기
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar Header -->
      <header class="top-bar">
        <div class="header-title">
          <h1 id="view-title">대시보드 & 종합 통계</h1>
          <p id="view-desc">플랫폼 핵심 활동 데이터, 도서, 회원 및 신고 처리 상태를 실시간 감시합니다.</p>
        </div>
        <div class="top-actions">
          <div class="live-status">
            <span class="status-dot"></span> Realtime Sync
          </div>
          <button class="btn btn-secondary" onclick="renderCurrentView()">🔄 데이터 갱신</button>
          <button class="btn btn-secondary" id="themeToggleBtn" onclick="toggleTheme()">🌙 테마 변경</button>
        </div>
      </header>

      <!-- View Container -->
      <div class="view-container" id="viewContainer">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Modal Target Area -->
  <div id="modalTarget"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script>
    /* ---------- Data Repository & LocalStorage Sync ---------- */
    const DB_KEY = 'jigeumini_db_v9';
    let db = loadDB();

    function loadDB() {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.contents)) {
            ensureInitialSchema(parsed);
            return parsed;
          }
        } catch (e) {}
      }
      return initDemoDB();
    }

    /* ---------- Supabase Database Connection & Sync ---------- */
    const SUPABASE_URL = 'https://eypvienfpglkdhzxmtet.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_r77QHYdEBQ_G6g5m67EPaQ_RIeCFwxO';
    let supabaseClient = null;

    if (window.supabase && SUPABASE_URL.startsWith('https://')) {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('⚡ Admin Supabase Client Initialized!');
      } catch (e) {
        console.warn('Supabase initialization error:', e);
      }
    }

    function saveDB() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      updateNavBadges();
      if (typeof syncToSupabase === 'function') syncToSupabase();
    }

    async function syncToSupabase() {
      if (!supabaseClient || !db) return;
      try {
        if (db.contents && db.contents.length > 0) {
          const bookRows = db.contents.map(c => ({
            id: String(c.id),
            type: c.type || 'BOOK',
            title: c.title || '',
            creator: c.creator || c.authors || '',
            publisher: c.publisher || '',
            isbn: c.isbn || '',
            cover: c.cover || c.thumbnail || null,
            genre: c.genre || '소설',
            total_page: c.totalPoint || c.page_count || null,
            rating: c.rating || 0,
            source_provider: c.sourceProvider || c.source || 'KAKAO'
          }));
          await supabaseClient.from('books').upsert(bookRows, { onConflict: 'id' });
        }

        if (db.posts && db.posts.length > 0) {
          const postRows = db.posts.map(p => ({
            id: String(p.id),
            book_id: String(p.contentId),
            point: p.point || null,
            memo_type: p.memoType || 'QUOTE',
            text: p.text || '',
            review: p.review || '',
            rating: p.rating || 0,
            spoiler: !!p.spoiler,
            likes: p.likes || 0
          }));
          await supabaseClient.from('posts').upsert(postRows, { onConflict: 'id' });
        }

        if (db.comments && db.comments.length > 0) {
          const commentRows = db.comments.map(cm => ({
            id: String(cm.id),
            post_id: String(cm.postId),
            text: cm.text || '',
            nickname: cm.nickname || '익명'
          }));
          await supabaseClient.from('comments').upsert(commentRows, { onConflict: 'id' });
        }
      } catch (e) {
        console.warn('Supabase sync warning:', e);
      }
    }

    async function syncFromSupabase() {
      if (!supabaseClient || !db) return;
      try {
        const { data: booksData } = await supabaseClient.from('books').select('*');
        if (booksData && booksData.length > 0) {
          booksData.forEach(b => {
            const idx = db.contents.findIndex(c => String(c.id) === String(b.id));
            const item = {
              id: b.id,
              type: b.type || 'BOOK',
              title: b.title,
              creator: b.creator,
              publisher: b.publisher,
              isbn: b.isbn,
              cover: b.cover,
              genre: b.genre || '소설',
              totalPoint: b.total_page,
              rating: b.rating,
              sourceProvider: b.source_provider
            };
            if (idx >= 0) db.contents[idx] = { ...db.contents[idx], ...item };
            else db.contents.push(item);
          });
        }

        const { data: postsData } = await supabaseClient.from('posts').select('*');
        if (postsData && postsData.length > 0) {
          postsData.forEach(p => {
            const idx = db.posts.findIndex(existing => String(existing.id) === String(p.id));
            const item = {
              id: p.id,
              contentId: p.book_id,
              point: p.point,
              memoType: p.memo_type || 'QUOTE',
              text: p.text,
              review: p.review,
              rating: p.rating,
              spoiler: p.spoiler,
              nickname: p.nickname || '익명 수집가',
              mine: false,
              likes: p.likes || 0,
              comments: 0,
              createdAt: new Date(p.created_at || Date.now()).getTime()
            };
            if (idx >= 0) db.posts[idx] = { ...db.posts[idx], ...item };
            else db.posts.push(item);
          });
        }

        const { data: commentsData } = await supabaseClient.from('comments').select('*');
        if (commentsData && commentsData.length > 0) {
          if (!db.comments) db.comments = [];
          commentsData.forEach(cm => {
            const idx = db.comments.findIndex(existing => String(existing.id) === String(cm.id));
            const item = {
              id: cm.id,
              postId: cm.post_id,
              text: cm.text,
              nickname: cm.nickname || '익명',
              createdAt: new Date(cm.created_at || Date.now()).getTime()
            };
            if (idx >= 0) db.comments[idx] = { ...db.comments[idx], ...item };
            else db.comments.push(item);
          });
        }

        localStorage.setItem(DB_KEY, JSON.stringify(db));
        if (typeof renderCurrentView === 'function') renderCurrentView();
      } catch(e) {
        console.warn('Supabase fetch error:', e);
      }
    }

    /* ---------- Toast Notification ---------- */
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span>${type === 'error' ? '⚠️' : '⚡'}</span> <span>${esc(msg)}</span>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    function esc(s) {
      return (s || '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtDate(ts) {
      if (!ts) return '-';
      const d = new Date(ts);
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function logAdminAction(action, details) {
      if (!db.adminLogs) db.adminLogs = [];
      db.adminLogs.unshift({
        id: 'log_' + Date.now(),
        action,
        details,
        timestamp: Date.now()
      });
      saveDB();
    }

    /* ---------- Theme Toggle ---------- */
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('themeToggleBtn').innerText = next === 'light' ? '🌙 다크모드' : '☀️ 라이트모드';
      renderCurrentView();
    }

    function initDashboardCharts() {
      // Destroy existing instances
      Object.values(chartInstances).forEach(c => c && c.destroy && c.destroy());
      chartInstances = {};

      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const textColor = isLight ? '#475569' : '#94A3B8';
      const gridColor = isLight ? '#E2E8F0' : '#334155';

      // 1. Trend Chart
      const ctxTrend = document.getElementById('chartTrend');
      if (ctxTrend) {
        chartInstances.trend = new Chart(ctxTrend, {
          type: 'line',
          data: {
            labels: ['6일 전', '5일 전', '4일 전', '3일 전', '2일 전', '어제', '오늘'],
            datasets: [
              { label: '독서 카드', data: [5, 8, 12, 9, 14, 18, db.posts.length], borderColor: '#6366F1', backgroundColor: 'rgba(99,102,241,0.1)', fill: true, tension: 0.3 },
              { label: '작성 댓글', data: [2, 4, 7, 5, 8, 11, db.comments.length], borderColor: '#F59E0B', backgroundColor: 'transparent', tension: 0.3 },
              { label: '접수 신고', data: [0, 1, 0, 2, 1, 3, db.reports.length], borderColor: '#EF4444', backgroundColor: 'transparent', tension: 0.3 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor } } }, scales: { x: { ticks: { color: textColor }, grid: { color: gridColor } }, y: { ticks: { color: textColor }, grid: { color: gridColor } } } }
        });
      }

      // 2. Genre Chart
      const ctxGenres = document.getElementById('chartGenres');
      if (ctxGenres) {
        const genreCounts = {};
        db.contents.forEach(b => { genreCounts[b.genre || '기타'] = (genreCounts[b.genre || '기타'] || 0) + 1; });
        chartInstances.genres = new Chart(ctxGenres, {
          type: 'doughnut',
          data: {
            labels: Object.keys(genreCounts),
            datasets: [{ data: Object.values(genreCounts), backgroundColor: ['#6366F1', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#14B8A6'] }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: textColor } } } }
        });
      }

      // 3. Tiers Chart
      const ctxTiers = document.getElementById('chartTiers');
      if (ctxTiers) {
        const tierCounts = { '프론티어': 0, '브론즈': 0, '실버': 0, '골드': 0, '플래티넘': 0, '에메랄드': 0, '다이아몬드': 0, '마스터': 0, '챌린저': 0 };
        db.users.forEach(u => { const t = u.tier || '프론티어'; tierCounts[t] = (tierCounts[t] || 0) + 1; });
        chartInstances.tiers = new Chart(ctxTiers, {
          type: 'bar',
          data: {
            labels: Object.keys(tierCounts),
            datasets: [{ label: '회원 수', data: Object.values(tierCounts), backgroundColor: '#8B5CF6', borderRadius: 4 }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: textColor, font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: textColor }, grid: { color: gridColor } } } }
        });
      }

      // 4. Reports Status Chart
      const ctxReports = document.getElementById('chartReports');
      if (ctxReports) {
        const pending = db.reports.filter(r => r.status === 'pending').length;
        const resolved = db.reports.filter(r => r.status === 'resolved').length;
        const dismissed = db.reports.filter(r => r.status === 'dismissed').length;
        chartInstances.reports = new Chart(ctxReports, {
          type: 'pie',
          data: {
            labels: ['대기 중 (Pending)', '조치 완료 (Deleted)', '기각 처리 (Dismissed)'],
            datasets: [{ data: [pending, resolved, dismissed], backgroundColor: ['#EF4444', '#10B981', '#94A3B8'] }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: textColor } } } }
        });
      }

    /* 2. Books View Pagination (25 items per page) */
    let bookSearchQuery = '';
    let bookGenreFilter = 'ALL';
    let bookPage = 1;
    const BOOK_PAGE_SIZE = 25;

    function changeBookPage(p) {
      bookPage = p;
      renderBooksView(document.getElementById('viewContainer'));
    }

    function renderPaginationHtml(currentPage, totalPages, onPageChangeFnName, totalCount) {
      if (totalPages <= 1) return '';
      
      let pageButtons = '';
      const maxButtons = 5;
      let startPage = Math.max(1, currentPage - 2);
      let endPage = Math.min(totalPages, startPage + maxButtons - 1);
      if (endPage - startPage + 1 < maxButtons) {
        startPage = Math.max(1, endPage - maxButtons + 1);
      }

      for (let i = startPage; i <= endPage; i++) {
        const isCurrent = i === currentPage;
        pageButtons += `
          <button class="btn btn-sm ${isCurrent ? 'btn-primary' : 'btn-secondary'}" style="min-width:32px; padding:4px 8px; font-weight:${isCurrent ? '800' : '600'};" onclick="${onPageChangeFnName}(${i})">
            ${i}
          </button>
        `;
      }

      return `
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:var(--card-dark); border-top:1px solid var(--card-border); flex-wrap:wrap; gap:10px;">
          <div style="font-size:12px; color:var(--text-muted); font-weight:600;">
            총 <strong>${totalCount || 0}</strong>개 (페이지 <strong>${currentPage}</strong> / ${totalPages})
          </div>
          <div style="display:flex; align-items:center; gap:4px;">
            <button class="btn btn-sm btn-secondary" ${currentPage <= 1 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''} onclick="${onPageChangeFnName}(${currentPage - 1})">◀ 이전</button>
            ${pageButtons}
            <button class="btn btn-sm btn-secondary" ${currentPage >= totalPages ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''} onclick="${onPageChangeFnName}(${currentPage + 1})">다음 ▶</button>
          </div>
        </div>
      `;
    }

    function renderBooksView(container) {

      const filtered = db.contents.filter(b => {
        const matchesQuery = !bookSearchQuery || b.title.toLowerCase().includes(bookSearchQuery.toLowerCase()) || (b.creator && b.creator.toLowerCase().includes(bookSearchQuery.toLowerCase())) || (b.isbn && b.isbn.includes(bookSearchQuery));

        return matchesQuery && matchesGenre;
      });

      const totalBookPages = Math.ceil(filtered.length / BOOK_PAGE_SIZE) || 1;
      if (bookPage > totalBookPages) bookPage = totalBookPages;
      if (bookPage < 1) bookPage = 1;

      const pageBooks = filtered.slice((bookPage - 1) * BOOK_PAGE_SIZE, bookPage * BOOK_PAGE_SIZE);

      container.innerHTML = `

          </div>
          <select class="select-filter" onchange="bookGenreFilter = this.value; bookPage = 1; renderBooksView(document.getElementById('viewContainer'));">
            ${genres.map(g => `<option value="${g}" ${bookGenreFilter === g ? 'selected' : ''}>${g === 'ALL' ? '📖 전체 장르' : g}</option>`).join('')}
          </select>
          <button class="btn btn-primary" onclick="openAddBookModal()">➕ 신규 도서 등록</button>
        </div>

        <div class="data-table-card">

            <table>
              <thead>
                <tr>
                  <th>표지</th>
                  <th>도서 정보</th>
                  <th>장르</th>
                  <th>총 페이지</th>
                  <th>평점</th>
                  <th>완독 독자수</th>
                  <th>ISBN</th>
                  <th>관리 조치</th>
                </tr>
              </thead>
              <tbody>
                ${pageBooks.map(b => `
                  <tr>
                    <td>
                      ${b.cover ? `<img src="${esc(b.cover)}" style="width:40px; height:56px; object-fit:cover; border-radius:4px; border:1px solid var(--card-border);">` : `<div style="width:40px; height:56px; border-radius:4px; background:var(--card-border); display:flex; align-items:center; justify-content:center; font-size:16px;">📖</div>`}
                    </td>
                    <td>
                      <div style="font-weight:800; font-size:14px; color:var(--text-main);">${esc(b.title)}</div>
                      <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">✍️ ${esc(b.creator || '미상')} · 🏢 ${esc(b.publisher || '미상')}</div>
                    </td>
                    <td><span class="badge badge-primary">${esc(b.genre || '소설')}</span></td>
                    <td><strong>${b.totalPoint || 300}p</strong></td>
                    <td><span style="color:var(--accent-orange); font-weight:800;">★ ${b.rating || '0.0'}</span></td>
                    <td>${b.readerCount || 0}명</td>
                    <td style="font-family:monospace; font-size:11.5px; color:var(--text-muted);">${esc(b.isbn || '-')}</td>
                    <td>
                      <div style="display:flex; gap:6px;">
                        <button class="btn btn-sm btn-secondary" onclick="openEditBookModal('${b.id}')">✏️ 정보 수정</button>

                      </div>
                    </td>
                  </tr>
                `).join('') || `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);">조건에 일치하는 도서가 없습니다.</td></tr>`}
              </tbody>
            </table>
          </div>
          ${renderPaginationHtml(bookPage, totalBookPages, 'changeBookPage', filtered.length)}
        </div>
      `;
    }

    function saveAddBook(e) {
      e.preventDefault();
      const title = document.getElementById('add-title').value.trim();
      const newBook = {
        id: 'b_' + Date.now(),
        type: 'BOOK',
        title: title,
        creator: document.getElementById('add-creator').value.trim(),
        publisher: document.getElementById('add-publisher').value.trim(),
        genre: document.getElementById('add-genre').value,
        totalPoint: parseInt(document.getElementById('add-totalPoint').value) || 250,
        cover: document.getElementById('add-cover').value.trim() || null,
        isbn: document.getElementById('add-isbn').value.trim() || '',
        rating: 0,
        readerCount: 0,
        createdAt: Date.now()
      };
      db.contents.unshift(newBook);
      saveDB();
      logAdminAction('신규 도서 등록', `'${title}' 도서 생성 완료`);
      showToast('신규 도서가 마스터 DB에 등록되었습니다.');
      closeModal();
      renderCurrentView();
    }

    async function deleteBookAction(id) {
      const book = db.contents.find(b => b.id === id);
      if (!book) return;
      if (confirm(`'${book.title}' 도서를 마스터 DB에서 삭제하시겠습니까?\n관련 독서 카드도 함께 삭제되며 Supabase DB에서도 즉시 지워집니다.`)) {
        db.contents = db.contents.filter(b => b.id !== id);
        db.posts = db.posts.filter(p => p.contentId !== id);
        db.myContent = db.myContent.filter(m => m.contentId !== id);
        saveDB();

        if (supabaseClient) {
          try {
            await supabaseClient.from('books').delete().eq('id', String(id));
            await supabaseClient.from('posts').delete().eq('book_id', String(id));
            await supabaseClient.from('my_contents').delete().eq('book_id', String(id));
          } catch (e) {
            console.warn('Supabase delete book error:', e);
          }
        }

        logAdminAction('도서 삭제', `'${book.title}' 도서 및 종속 카드 Supabase 연쇄 삭제`);
        showToast('도서가 Supabase DB 및 마스터 서버에서 완벽 삭제되었습니다.');
        renderCurrentView();
      }
    }

    let reportPage = 1;
    const REPORT_PAGE_SIZE = 25;

    function changeReportPage(p) {
      reportPage = p;
      renderReportsView(document.getElementById('viewContainer'));
    }

    function renderReportsView(container) {
      const filtered = db.reports.filter(r => {
        if (reportFilterTab === 'pending') return r.status === 'pending';
        if (reportFilterTab === 'resolved') return r.status === 'resolved' || r.status === 'dismissed';
        if (reportFilterTab === 'post') return r.targetType === 'post';
        if (reportFilterTab === 'comment') return r.targetType === 'comment';
        return true;
      });

      const totalReportPages = Math.ceil(filtered.length / REPORT_PAGE_SIZE) || 1;
      if (reportPage > totalReportPages) reportPage = totalReportPages;

            <button class="btn ${reportFilterTab === 'post' ? 'btn-primary' : 'btn-secondary'}" onclick="reportFilterTab='post'; reportPage=1; renderReportsView(document.getElementById('viewContainer'));">✍️ 게시글 신고</button>
            <button class="btn ${reportFilterTab === 'comment' ? 'btn-primary' : 'btn-secondary'}" onclick="reportFilterTab='comment'; reportPage=1; renderReportsView(document.getElementById('viewContainer'));">💬 댓글 신고</button>
            <button class="btn ${reportFilterTab === 'resolved' ? 'btn-success' : 'btn-secondary'}" onclick="reportFilterTab='resolved'; reportPage=1; renderReportsView(document.getElementById('viewContainer'));">✅ 처리/기각 완료 (${db.reports.filter(r=>r.status!=='pending').length})</button>
            <button class="btn ${reportFilterTab === 'all' ? 'btn-primary' : 'btn-secondary'}" onclick="reportFilterTab='all'; reportPage=1; renderReportsView(document.getElementById('viewContainer'));">📋 전체 히스토리</button>

                </tr>
              </thead>
              <tbody>
                ${pageReports.map(r => {
                  const targetAuthor = db.users.find(u => u.id === r.targetAuthorId || u.nickname === r.targetAuthorName);
                  return `
                    <tr>
                      <td style="font-family:monospace; font-size:11.5px;">${r.id}</td>
                      <td><span class="badge ${r.targetType === 'post' ? 'badge-primary' : (r.targetType === 'comment' ? 'badge-warning' : 'badge-danger')}">${r.targetType.toUpperCase()}</span></td>
                      <td><strong style="color:var(--accent-red);">${esc(r.reason)}</strong></td>

                      <td>
                        <div style="font-weight:800; color:var(--text-main);">${esc(r.targetAuthorName)} ${targetAuthor && targetAuthor.isBanned ? '<span class="badge badge-danger">차단됨</span>' : ''}</div>

                      <td>
                        ${r.status === 'pending' ? `
                          <div style="display:flex; gap:4px; flex-wrap:wrap; align-items:center; min-width:180px;">
                            <button class="btn btn-sm btn-danger" style="white-space:nowrap; flex-shrink:0;" onclick="resolveReportAction('${r.id}', 'delete')">🗑 삭제</button>

                            <button class="btn btn-sm btn-warning" style="white-space:nowrap; flex-shrink:0;" onclick="blockUserFromReport('${r.targetAuthorId}', '${esc(r.targetAuthorName)}')">🚫 차단</button>

                        ` : '<span style="font-size:12px; color:var(--text-muted);">처리 완료됨</span>'}

                    </tr>

        </div>
      `;

    async function resolveReportAction(reportId, actionType) {
      const report = db.reports.find(r => r.id === reportId);
      if (!report) return;

      if (actionType === 'delete') {
        if (confirm('신고된 콘텐츠를 삭제하고 완료 처리하시겠습니까?\nSupabase DB에서도 즉시 지워집니다.')) {
          if (report.targetType === 'post') {
            db.posts = db.posts.filter(p => p.id !== report.targetId);
            if (supabaseClient) {
              try { await supabaseClient.from('posts').delete().eq('id', String(report.targetId)); } catch(e){}
            }
          } else if (report.targetType === 'comment') {
            db.comments = db.comments.filter(c => c.id !== report.targetId);
            if (supabaseClient) {
              try { await supabaseClient.from('comments').delete().eq('id', String(report.targetId)); } catch(e){}
            }
          }
          report.status = 'resolved';
          saveDB();
          logAdminAction('신고 콘텐츠 삭제', `신고ID ${reportId} 대상을 Supabase 및 마스터 DB에서 삭제 처리함`);
          showToast('콘텐츠가 Supabase DB에서 삭제되었으며 신고 처리가 완료되었습니다.');
          renderCurrentView();
        }
      } else if (actionType === 'dismiss') {
        report.status = 'dismissed';
        saveDB();
        logAdminAction('신고 기각', `신고ID ${reportId} 사유 미충족으로 기각함`);
        showToast('신고 항목이 기각 처리되었습니다.');
        renderCurrentView();
      }
    }

    function blockUserFromReport(userId, userName) {
      let targetUser = db.users.find(u => u.id === userId || u.nickname === userName);
      if (!targetUser) {
        targetUser = { id: userId || ('u_' + Date.now()), nickname: userName, email: `${userName}@user.app`, completedBooks: 0, postsCount: 0, reportsReceived: 1, isAdmin: false, isBanned: true, tier: '프론티어', createdAt: Date.now() };
        db.users.push(targetUser);
      }
      targetUser.isBanned = true;
      targetUser.banReason = '신고 모니터링 관리자 직권 차단';
      saveDB();
      logAdminAction('회원 차단', `사용자 '${userName}' 계정 강제 차단`);
      showToast(`'${userName}' 계정이 성공적으로 차단 처리되었습니다.`);
      renderCurrentView();
    }

    let userPage = 1;
    const USER_PAGE_SIZE = 25;

    function changeUserPage(p) {
      userPage = p;
      renderUsersView(document.getElementById('viewContainer'));
    }

      const filtered = db.users.filter(u => {
        const matchesQuery = !userSearchQuery || u.nickname.toLowerCase().includes(userSearchQuery.toLowerCase()) || (u.email && u.email.toLowerCase().includes(userSearchQuery.toLowerCase()));
        let matchesStatus = true;
        if (userStatusFilter === 'BANNED') matchesStatus = u.isBanned;
        if (userStatusFilter === 'ACTIVE') matchesStatus = !u.isBanned;
        if (userStatusFilter === 'FLAGGED') matchesStatus = (u.reportsReceived || 0) >= 3;
        return matchesQuery && matchesStatus;
      });

      const totalUserPages = Math.ceil(filtered.length / USER_PAGE_SIZE) || 1;
      if (userPage > totalUserPages) userPage = totalUserPages;
      if (userPage < 1) userPage = 1;

      const pageUsers = filtered.slice((userPage - 1) * USER_PAGE_SIZE, userPage * USER_PAGE_SIZE);

      container.innerHTML = `

          <div class="search-input-wrap">

            <input type="text" class="search-input" placeholder="회원 닉네임 / 이메일 / ID 검색..." value="${esc(userSearchQuery)}" oninput="userSearchQuery = this.value; userPage = 1; renderUsersView(document.getElementById('viewContainer'));">

          <select class="select-filter" onchange="userStatusFilter = this.value; userPage = 1; renderUsersView(document.getElementById('viewContainer'));">

              <thead>

                  <th>독서 등급 (Tier)</th>
                  <th>완독 권수</th>
                  <th>작성 포스트</th>
                  <th>누적 신고 받음</th>

                  <th>관리 조치</th>

              </thead>
              <tbody>
                ${pageUsers.map(u => `
                  <tr>
                    <td>
                      <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:36px; height:36px; border-radius:50%; background:var(--accent-primary); color:#FFF; font-weight:800; display:flex; align-items:center; justify-content:center;">${esc((u.nickname||'U').slice(0,1))}</div>
                        <div>
                          <div style="font-weight:800; color:var(--text-main);">${esc(u.nickname)} ${u.isAdmin ? '👑' : ''}</div>

                    <td><span class="badge badge-warning">${({ '프론티어':'🌱', '브론즈':'🥉', '실버':'🥈', '골드':'🥇', '플래티넘':'💎', '에메랄드':'❇️', '다이아몬드':'💎', '마스터':'👑', '챌린저':'🔥' })[u.tier] || '🌱'} ${esc(u.tier || '프론티어')}</span></td>

                    <td>${u.postsCount || 0}개</td>

                    <td>${u.isBanned ? '<span class="badge badge-danger">🔴 차단됨</span>' : '<span class="badge badge-success">🟢 정상</span>'}</td>
                    <td>${fmtDate(u.createdAt)}</td>
                    <td>
                      <div style="display:flex; gap:6px;">
                        ${u.isBanned ? `
                          <button class="btn btn-sm btn-success" onclick="toggleUserBan('${u.id}', false)">🟢 차단 해제</button>
                        ` : `
                          <button class="btn btn-sm btn-danger" onclick="toggleUserBan('${u.id}', true)">🚫 계정 차단</button>

    function toggleUserBan(userId, doBan) {
      const user = db.users.find(u => u.id === userId);
      if (!user) return;

      if (doBan) {
        const reason = prompt(`'${user.nickname}' 계정을 차단하시겠습니까? 사유를 입력하세요:`, '운영 정책 위반 및 신고 누적');
        if (reason !== null) {
          user.isBanned = true;
          user.banReason = reason;
          saveDB();
          logAdminAction('회원 차단', `'${user.nickname}' 계정 차단 (사유: ${reason})`);
          showToast(`'${user.nickname}' 계정이 차단되었습니다.`);
          renderCurrentView();
        }
      } else {
        if (confirm(`'${user.nickname}' 계정 차단을 해제하시겠습니까?`)) {
          user.isBanned = false;
          user.banReason = null;
          saveDB();
          logAdminAction('차단 해제', `'${user.nickname}' 계정 정상화`);
          showToast(`'${user.nickname}' 계정 차단이 해제되었습니다.`);
          renderCurrentView();
        }
      }
    }

    function openChangeTierModal(userId) {
      const user = db.users.find(u => u.id === userId);
      if (!user) return;

      const tiers = ['프론티어', '브론즈', '실버', '골드', '플래티넘', '에메랄드', '다이아몬드', '마스터', '챌린저'];
      const target = document.getElementById('modalTarget');
      target.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
          <div class="modal-box">
            <div class="modal-header">
              <h3>👑 회원 독서 계급 수동 조정 (${esc(user.nickname)})</h3>
              <button class="close-modal-btn" onclick="closeModal()">✕</button>
            </div>
            <form onsubmit="saveUserTier(event, '${user.id}')">
              <div class="form-group">
                <label>현재 등급: ${esc(user.tier || '프론티어')}</label>
                <select class="form-control" id="change-tier-select">
                  ${tiers.map(t => `<option value="${t}" ${user.tier === t ? 'selected' : ''}>${t}</option>`).join('')}

              </div>
              <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button type="submit" class="btn btn-primary">변경 완료</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function saveUserTier(e, userId) {
      e.preventDefault();
      const user = db.users.find(u => u.id === userId);
      if (user) {
        const nextTier = document.getElementById('change-tier-select').value;
        user.tier = nextTier;
        saveDB();
        logAdminAction('회원 등급 변경', `'${user.nickname}' 등급을 ${nextTier}(으)로 변경`);
        showToast('회원 등급이 성공적으로 조정되었습니다.');
        closeModal();
        renderCurrentView();

    /* 5. Posts & Comments View Pagination (50 items per page with Top Sub-Tabs) */

    async function deletePostAction(id) {
      if (confirm('선택한 독서 카드를 삭제하시겠습니까?\nSupabase DB에서도 즉시 지워집니다.')) {
        db.posts = db.posts.filter(p => p.id !== id);
        saveDB();

        if (supabaseClient) {
          try {
            await supabaseClient.from('posts').delete().eq('id', String(id));
          } catch (e) {
            console.warn('Supabase delete post error:', e);
          }
        }

        logAdminAction('독서 카드 삭제', `포스트ID ${id} Supabase 연동 삭제`);
        showToast('독서 카드가 Supabase DB 및 마스터 서버에서 완전히 삭제되었습니다.');
        renderCurrentView();
      }
    }

    async function deleteCommentAction(id) {
      if (confirm('선택한 댓글을 삭제하시겠습니까?\nSupabase DB에서도 즉시 지워집니다.')) {
        db.comments = db.comments.filter(c => c.id !== id);
        saveDB();

        if (supabaseClient) {
          try {
            await supabaseClient.from('comments').delete().eq('id', String(id));
          } catch (e) {
            console.warn('Supabase delete comment error:', e);
          }
        }

        logAdminAction('댓글 삭제', `댓글ID ${id} Supabase 연동 삭제`);
        showToast('댓글이 Supabase DB 및 마스터 서버에서 완전히 삭제되었습니다.');
        renderCurrentView();
      }
    }

    /* 6. Announcements View Pagination (25 items per page) */
    let annPage = 1;
    const ANN_PAGE_SIZE = 25;

    function changeAnnPage(p) {
      annPage = p;
      renderAnnouncementsView(document.getElementById('viewContainer'));
    }

    function renderAnnouncementsView(container) {
      const allAnns = db.announcements || [];
      const totalAnnPages = Math.ceil(allAnns.length / ANN_PAGE_SIZE) || 1;
      if (annPage > totalAnnPages) annPage = totalAnnPages;
      if (annPage < 1) annPage = 1;

      const pageAnns = allAnns.slice((annPage - 1) * ANN_PAGE_SIZE, annPage * ANN_PAGE_SIZE);

      container.innerHTML = `
        <div class="filter-bar">
          <button class="btn btn-primary" onclick="openAddAnnouncementModal()">📢 새 시스템 공지 등록</button>
        </div>

        <div class="data-table-card">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>제목</th>
                  <th>공지 본문 내용</th>
                  <th>노출 상태</th>
                  <th>등록 일시</th>
                  <th>관리</th>
                </tr>
              </thead>
              <tbody>
                ${pageAnns.map(a => `
                  <tr>
                    <td><strong style="color:var(--text-main); font-size:14px;">${esc(a.title)}</strong></td>
                    <td style="max-width:300px;">${esc(a.content)}</td>
                    <td>${a.active ? '<span class="badge badge-success">🟢 앱 노출 중</span>' : '<span class="badge badge-muted">⚪ 비활성</span>'}</td>
                    <td>${fmtDate(a.createdAt)}</td>
                    <td>
                      <div style="display:flex; gap:6px;">
                        <button class="btn btn-sm btn-secondary" onclick="toggleAnnouncementActive('${a.id}')">${a.active ? '비활성화' : '활성화'}</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteAnnouncementAction('${a.id}')">🗑 삭제</button>
                      </div>
                    </td>
                  </tr>
                `).join('') || `<tr><td colspan="5" style="text-align:center; padding:30px; color:var(--text-muted);">등록된 공지사항이 없습니다.</td></tr>`}
              </tbody>
            </table>
          </div>
          ${renderPaginationHtml(annPage, totalAnnPages, 'changeAnnPage', allAnns.length)}
        </div>
      `;
    }

    function openAddAnnouncementModal() {
      const target = document.getElementById('modalTarget');
      target.innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this) closeModal();">
          <div class="modal-box">
            <div class="modal-header">
              <h3>📢 새 시스템 공지사항 등록</h3>
              <button class="close-modal-btn" onclick="closeModal()">✕</button>
            </div>
            <form onsubmit="saveAnnouncement(event)">
              <div class="form-group">
                <label>공지사항 제목 *</label>
                <input type="text" class="form-control" id="ann-title" placeholder="예: [안내] 시스템 서비스 점검 안내" required>
              </div>
              <div class="form-group">
                <label>공지사항 상세 내용 *</label>
                <textarea class="form-control" id="ann-content" placeholder="사용자들에게 보여질 공지 메시지..." required></textarea>
              </div>
              <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
                <button type="submit" class="btn btn-primary">📢 등록 및 게시</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function saveAnnouncement(e) {
      e.preventDefault();
      const newAnn = {
        id: 'ann_' + Date.now(),
        title: document.getElementById('ann-title').value.trim(),
        content: document.getElementById('ann-content').value.trim(),
        active: true,
        createdAt: Date.now()
      };
      if (!db.announcements) db.announcements = [];
      db.announcements.unshift(newAnn);
      saveDB();
      logAdminAction('공지사항 등록', `'${newAnn.title}' 공지 게시`);
      showToast('새 공지사항이 전송되었습니다.');
      closeModal();
      renderCurrentView();
    }

    function toggleAnnouncementActive(id) {
      const ann = db.announcements.find(a => a.id === id);
      if (ann) {
        ann.active = !ann.active;
        saveDB();
        showToast('공지 노출 상태가 변경되었습니다.');
        renderCurrentView();
      }
    }

    function deleteAnnouncementAction(id) {
      if (confirm('공지사항을 삭제하시겠습니까?')) {
        db.announcements = db.announcements.filter(a => a.id !== id);
        saveDB();
        showToast('공지사항이 삭제되었습니다.');
        renderCurrentView();
      }
    }

    /* 7. Settings & Audit Logs View */
    function renderSettingsView(container) {
      container.innerHTML = `
        <div class="charts-grid" style="grid-template-columns:1fr 2fr;">
          <!-- DB Backup & Reset Controls -->
          <div class="data-table-card" style="padding:20px;">
            <h3 style="font-size:16px; font-weight:800; margin-bottom:12px;">💾 DB 백업 & 시스템 데이터 복구</h3>
            <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:20px; line-height:1.6;">
              현재 LocalStorage 상태를 JSON 파일로 다운로드하여 백업하거나, 기존 데이터를 복구하고 데모 상태로 초기화할 수 있습니다.
            </p>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <button class="btn btn-primary" onclick="exportDBData()">📥 전체 DB JSON 다운로드 백업</button>
              <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📤 DB JSON 파일 업로드 복원</button>
              <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importDBData(this)">
              <button class="btn btn-secondary" onclick="exportBooksCSV()">📊 도서 목록 CSV 엑셀 내보내기</button>
              <button class="btn btn-secondary" onclick="exportPostsCSV()">📊 독서카드 목록 CSV 엑셀 내보내기</button>
              <button class="btn btn-danger" style="margin-top:14px;" onclick="resetToDemoData()">🔄 데모 데이터셋 완전 재설정</button>
            </div>
          </div>

          <!-- Audit Logs Table -->
          <div class="data-table-card">
            <div style="padding:16px 20px; border-bottom:1px solid var(--card-border); font-size:15px; font-weight:800;">📜 관리자 조치 감사 로그 (Audit Logs)</div>
            <div class="table-responsive" style="max-height:450px; overflow-y:auto;">
              <table>
                <thead>
                  <tr>
                    <th>일시</th>
                    <th>관리자 조치 구분</th>
                    <th>상세 조치 내용</th>
                  </tr>
                </thead>
                <tbody>
                  ${(db.adminLogs || []).map(l => `
                    <tr>
                      <td style="font-size:11.5px; color:var(--text-muted); whitespace:nowrap;">${fmtDate(l.timestamp)}</td>
                      <td><span class="badge badge-primary">${esc(l.action)}</span></td>
                      <td>${esc(l.details)}</td>
                    </tr>
                  `).join('') || `<tr><td colspan="3" style="text-align:center; padding:20px; color:var(--text-muted);">감사 로그가 없습니다.</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function exportDBData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `sentence_collector_backup_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('DB 백업 파일이 다운로드되었습니다.');
    }

    function downloadCSV(csvContent, fileName) {
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function exportBooksCSV() {
      let csv = 'ID,도서제목,저자,출판사,장르,총페이지,평점,완독자수,ISBN\n';
      db.contents.forEach(b => {
        csv += `"${b.id}","${(b.title||'').replace(/"/g, '""')}","${(b.creator||'').replace(/"/g, '""')}","${(b.publisher||'').replace(/"/g, '""')}","${b.genre||''}","${b.totalPoint||0}","${b.rating||0}","${b.readerCount||0}","${b.isbn||''}"\n`;
      });
      downloadCSV(csv, `sentence_collector_books_${Date.now()}.csv`);
      logAdminAction('CSV 엑셀 내보내기', '도서 DB CSV 파일 다운로드');
      showToast('📊 도서 데이터 CSV 엑셀 파일이 다운로드되었습니다.');
    }

    function exportPostsCSV() {
      let csv = 'ID,도서ID,작성자,구분,본문내용,좋아요,작성일시\n';
      db.posts.forEach(p => {
        csv += `"${p.id}","${p.contentId||''}","${(p.nickname||'').replace(/"/g, '""')}","${p.memoType||''}","${(p.text||p.review||'').replace(/"/g, '""')}","${p.likes||0}","${fmtDate(p.createdAt)}"\n`;
      });
      downloadCSV(csv, `sentence_collector_posts_${Date.now()}.csv`);
      logAdminAction('CSV 엑셀 내보내기', '독서카드 DB CSV 파일 다운로드');
      showToast('📊 독서카드 데이터 CSV 엑셀 파일이 다운로드되었습니다.');
    }

    function resetToDemoData() {
      if (confirm('전체 데이터베이스를 초기 데모 상태로 재설정하시겠습니까? 모든 변경 데이터가 초기화됩니다.')) {
        db = initDemoDB();
        saveDB();
        showToast('초기 데모 데이터셋으로 복원되었습니다.');
        renderCurrentView();
      }
    }

    function closeModal() {
      document.getElementById('modalTarget').innerHTML = '';
    }

    /* ---------- Realtime Storage Sync Listener ---------- */
    window.addEventListener('storage', (e) => {
      if (e.key === DB_KEY) {
        db = loadDB();
        renderCurrentView();
        showToast('🔄 다른 탭의 데이터 변경사항이 실시간 동기화되었습니다.');
      }
    });

    /* ---------- Initial Boot ---------- */
    renderCurrentView();
    if (typeof syncFromSupabase === 'function') {
      syncFromSupabase();
    }
  </script>
</body>
</html>
